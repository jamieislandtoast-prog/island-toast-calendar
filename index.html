<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>島嶼生吐司-餐車跑攤行事曆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 預加載優化 -->
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .lucide { display: inline-block; vertical-align: middle; }
        #root:empty::before {
            content: "系統啟動中...";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ea580c;
            font-size: 14px;
            font-weight: bold;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-pop { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-orange-50/30">
    <div id="root"></div>

    <!-- 模組映射：解決手機端 import 路徑混亂問題 -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
      }
    }
    </script>

    <script type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import ReactDOM from 'react-dom';
        import * as LucideIcons from 'lucide-react';
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, addDoc, serverTimestamp } from "firebase/firestore";

        // --- Firebase 配置 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBiP8A8PrlZd31AdbcF_BPVRz6Q4OymDEc", 
            authDomain: "island-toast-app.firebaseapp.com",
            projectId: "island-toast-app",
            storageBucket: "island-toast-app.firebasestorage.app",
            messagingSenderId: "426992761060",
            appId: "1:426992761060:web:4cf940fedbc1fa2a3cd4f1"
        };
        const appId = 'island-toast-calendar';

        // 封裝 Icon 元件
        const Icon = ({ name, size = 16, className = "" }) => {
            const IconComponent = LucideIcons[name] || LucideIcons.HelpCircle;
            return React.createElement(IconComponent, { size, className });
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false); 
            const [currentDate, setCurrentDate] = useState(new Date());
            const [events, setEvents] = useState({});
            const [photos, setPhotos] = useState([]);
            const [appSettings, setAppSettings] = useState({
                title: '島嶼生吐司',
                subtitle: '餐車跑攤行事曆',
                logoUrl: '',
                lineId: '@lineid'
            });

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedDate, setSelectedDate] = useState(null);
            const [editingEvent, setEditingEvent] = useState({ location: '', time: '', note: '', type: 'work' });
            const dbRef = useRef(null);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('admin') === '1') setIsAdmin(true);

                try {
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    dbRef.current = getFirestore(app);

                    signInAnonymously(auth);
                    onAuthStateChanged(auth, u => setUser(u));
                } catch (e) {
                    console.error("Firebase Init Error:", e);
                }
            }, []);

            useEffect(() => {
                if (!user || !dbRef.current) return;
                const db = dbRef.current;
                
                const unsubEvents = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'events'), snap => {
                    const data = {}; snap.forEach(d => data[d.id] = d.data()); setEvents(data);
                });

                const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general'), snap => {
                    if (snap.exists()) setAppSettings(snap.data());
                });

                const unsubPhotos = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'photos'), snap => {
                    const data = []; snap.forEach(d => data.push({ id: d.id, ...d.data() }));
                    setPhotos(data.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                });

                return () => { unsubEvents(); unsubSettings(); unsubPhotos(); };
            }, [user]);

            const renderCalendar = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const totalDays = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(React.createElement('div', { key: `e-${i}`, className: "h-16 border border-orange-50/50" }));
                for (let d = 1; d <= totalDays; d++) {
                    const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const event = events[dateKey];
                    const isToday = new Date().toDateString() === new Date(year, month, d).toDateString();
                    days.push(
                        React.createElement('div', {
                            key: d,
                            onClick: () => {
                                setSelectedDate(dateKey);
                                setEditingEvent(events[dateKey] || { location: '', time: '', note: '', type: 'work' });
                                setIsModalOpen(true);
                            },
                            className: "h-16 border border-orange-100 p-1 cursor-pointer transition-all hover:bg-orange-50 bg-white relative"
                        }, [
                            React.createElement('span', { 
                                key: 'day',
                                className: `text-[10px] font-black ${isToday ? 'bg-orange-600 text-white w-5 h-5 flex items-center justify-center rounded-full' : 'text-gray-400'}` 
                            }, d),
                            event && React.createElement('div', {
                                key: 'event',
                                className: `mt-0.5 p-0.5 rounded-[4px] text-[8px] truncate border-l-2 shadow-sm font-bold ${event.type === 'work' ? 'bg-orange-50 text-orange-700 border-orange-500' : 'bg-gray-100 text-gray-500 border-gray-400'}`
                            }, event.type === 'rest' ? '店休' : event.location)
                        ])
                    );
                }
                return days;
            };

            if (!user) return React.createElement('div', { className: "flex items-center justify-center min-h-screen text-orange-600 font-bold" }, "伺服器連線中...");

            return (
                React.createElement('div', { className: "min-h-screen flex flex-col items-center py-4 px-2" }, 
                    React.createElement('div', { className: "w-full max-w-sm bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-orange-100 relative" }, [
                        isAdmin && React.createElement('div', { className: "bg-yellow-400 text-[10px] font-black py-1 text-center" }, "管理員模式"),
                        
                        React.createElement('div', { className: "bg-orange-600 p-6 text-white text-left" }, [
                            React.createElement('div', { className: "flex justify-between items-start mb-6" }, [
                                React.createElement('div', { className: "flex gap-4 items-center" }, [
                                    React.createElement('div', { className: "w-12 h-12 bg-white rounded-xl flex items-center justify-center border-2 border-orange-300" }, 
                                        appSettings.logoUrl ? React.createElement('img', { src: appSettings.logoUrl, className: "max-h-full" }) : React.createElement(Icon, { name: 'Camera', className: "text-orange-200" })
                                    ),
                                    React.createElement('div', {}, [
                                        React.createElement('h1', { className: "text-lg font-black" }, appSettings.title),
                                        React.createElement('p', { className: "text-orange-100 text-[10px]" }, appSettings.subtitle)
                                    ])
                                ]),
                                React.createElement('div', { className: "flex items-center gap-1 bg-black/10 p-2 rounded-xl text-[10px]" }, [
                                    React.createElement('button', { onClick: () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1)) }, React.createElement(Icon, { name: 'ChevronLeft' })),
                                    React.createElement('span', { className: "mx-1" }, `${currentDate.getMonth()+1}月`),
                                    React.createElement('button', { onClick: () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1)) }, React.createElement(Icon, { name: 'ChevronRight' }))
                                ])
                            ]),
                            React.createElement('a', { 
                                href: `https://line.me/R/ti/p/~${appSettings.lineId.replace('@','')}`, 
                                className: "w-full bg-[#06C755] py-3 rounded-xl flex items-center justify-center gap-2 text-xs font-black shadow-lg" 
                            }, [React.createElement(Icon, { name: 'MessageCircle' }), "LINE 預訂"])
                        ]),

                        React.createElement('div', { className: "grid grid-cols-7 text-center text-[10px] font-bold py-2 bg-orange-50 text-orange-600" }, 
                            ['日','一','二','三','四','五','六'].map(d => React.createElement('div', { key: d }, d))
                        ),
                        React.createElement('div', { className: "grid grid-cols-7" }, renderCalendar()),

                        React.createElement('div', { className: "p-6 bg-gray-50 min-h-[200px] pb-10" }, [
                            React.createElement('h3', { className: "font-black text-orange-600 text-xs mb-4 flex items-center gap-2" }, [React.createElement(Icon, { name: 'Megaphone' }), "最新公告"]),
                            photos.length === 0 ? React.createElement('div', { className: "text-center py-10 text-gray-300 text-[10px]" }, "目前無公告") : 
                            photos.map(p => React.createElement('div', { key: p.id, className: "mb-4 rounded-2xl overflow-hidden shadow-md" }, 
                                React.createElement('img', { src: p.url, className: "w-full" })
                            ))
                        ])
                    ]),

                    isModalOpen && React.createElement('div', { 
                        className: "fixed inset-0 bg-black/70 flex items-center justify-center p-6 z-50",
                        onClick: () => setIsModalOpen(false)
                    }, 
                        React.createElement('div', { 
                            className: "bg-white rounded-3xl w-full max-w-xs p-6 animate-pop",
                            onClick: e => e.stopPropagation()
                        }, [
                            React.createElement('h4', { className: "font-black text-orange-600 mb-4 border-b pb-2" }, selectedDate),
                            editingEvent.type === 'rest' ? React.createElement('p', { className: "text-center py-4 font-bold text-gray-400" }, "今日店休") :
                            React.createElement('div', { className: "space-y-3" }, [
                                React.createElement('div', {}, [React.createElement('p', { className: "text-[10px] text-gray-400 font-bold" }, "地點"), React.createElement('p', { className: "font-black" }, editingEvent.location || '未設定')]),
                                React.createElement('div', {}, [React.createElement('p', { className: "text-[10px] text-gray-400 font-bold" }, "時間"), React.createElement('p', { className: "font-black text-orange-600" }, editingEvent.time || '未設定')])
                            ]),
                            React.createElement('button', { 
                                onClick: () => setIsModalOpen(false),
                                className: "w-full mt-6 py-3 bg-gray-100 rounded-xl font-bold text-gray-500" 
                            }, "關閉")
                        ])
                    )
                )
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
    </script>
</body>
</html>
