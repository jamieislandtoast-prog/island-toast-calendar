<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>島嶼生吐司 - 行事曆</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel: 讓瀏覽器能跑 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase (Compat) CDN：不用 import、直接用 firebase.* -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .animate-marquee { display: inline-flex; animation: marquee 15s linear infinite; }
  </style>
</head>

<body class="bg-[#FFFDFB]">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    // ===== Firebase 設定（你提供的）=====
    const firebaseConfig = {
      apiKey: "AIzaSyBiP8A8PrlZd31AdbcF_BPVRz6Q4OymDEc",
      authDomain: "island-toast-app.firebaseapp.com",
      projectId: "island-toast-app",
      storageBucket: "island-toast-app.firebasestorage.app",
      messagingSenderId: "426992761060",
      appId: "1:426992761060:web:4cf940fedbc1fa2a3cd4f1"
    };

    const ISLAND_APP_ID = "island-toast-live";

    // ===== 初始化 Firebase（避免重複 init）=====
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);

      const [currentDate, setCurrentDate] = useState(new Date());
      const [events, setEvents] = useState({});
      const [photos, setPhotos] = useState([]);

      const [appSettings, setAppSettings] = useState({
        title: "島嶼生吐司",
        subtitle: "來自大海氣息的蓬鬆柔軟",
        lineId: "@516mdfqz",
        logoUrl: "https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=200&h=200&auto=format&fit=crop",
        marquee: "🍞 每日新鮮限量現烤，歡迎透過 LINE 提前預約！"
      });

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [selectedDate, setSelectedDate] = useState(null);
      const [editingEvent, setEditingEvent] = useState({ location: "", time: "", note: "", type: "work" });
      const [tempSettings, setTempSettings] = useState(appSettings);
      const [isUploading, setIsUploading] = useState(false);

      const fileInputRef = useRef(null);
      const logoInputRef = useRef(null);

      const paths = useMemo(() => {
        return {
          eventsCol: `artifacts/${ISLAND_APP_ID}/public/data/events`,
          photosCol: `artifacts/${ISLAND_APP_ID}/public/data/photos`,
          settingsDoc: `artifacts/${ISLAND_APP_ID}/public/data/settings/general`
        };
      }, []);

      // ===== 管理員模式 + Firebase 匿名登入 =====
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("admin") === "1") setIsAdmin(true);

        const unsub = auth.onAuthStateChanged((u) => setUser(u || null));
        auth.signInAnonymously().catch((err) => {
          console.error("Firebase 認證失敗", err);
          alert("Firebase 認證失敗，請確認網路或 Firebase 設定。");
        });

        return () => unsub();
      }, []);

      // ===== Firestore 即時同步 =====
      useEffect(() => {
        if (!user) return;

        const unsubEvents = db.collection(paths.eventsCol).onSnapshot((snap) => {
          const data = {};
          snap.forEach((d) => data[d.id] = d.data());
          setEvents(data);
        }, (err) => console.error("events snapshot error", err));

        const unsubPhotos = db.collection(paths.photosCol).onSnapshot((snap) => {
          const data = [];
          snap.forEach((d) => data.push({ id: d.id, ...d.data() }));

          // createdAt 可能是 Timestamp，也可能沒有
          data.sort((a, b) => {
            const as = (a.createdAt && a.createdAt.seconds) ? a.createdAt.seconds : 0;
            const bs = (b.createdAt && b.createdAt.seconds) ? b.createdAt.seconds : 0;
            return bs - as;
          });

          setPhotos(data);
        }, (err) => console.error("photos snapshot error", err));

        const unsubSettings = db.doc(paths.settingsDoc).onSnapshot((snap) => {
          if (snap.exists) setAppSettings(snap.data());
        }, (err) => console.error("settings snapshot error", err));

        return () => { unsubEvents(); unsubPhotos(); unsubSettings(); };
      }, [user, paths]);

      // ===== 切換月份 =====
      const changeMonth = (offset) => {
        const newDate = new Date(currentDate);
        newDate.setMonth(currentDate.getMonth() + offset);
        setCurrentDate(newDate);
      };

      // ===== 圖片壓縮（base64）=====
      const compressImage = (file, maxWidth = 800) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onerror = reject;
          reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              const canvas = document.createElement("canvas");
              let width = img.width;
              let height = img.height;

              if (width > maxWidth) {
                height = (maxWidth / width) * height;
                width = maxWidth;
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              // jpeg 0.8：足夠清晰且較省空間
              resolve(canvas.toDataURL("image/jpeg", 0.8));
            };
            img.onerror = reject;
          };
        });
      };

      // ===== 上傳 Logo/公告圖 =====
      const handleUpload = async (e, type) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setIsUploading(true);
        try {
          const compressedBase64 = await compressImage(file, type === "logo" ? 400 : 1200);

          if (type === "logo") {
            await db.doc(paths.settingsDoc).set(
              { ...appSettings, logoUrl: compressedBase64 },
              { merge: true }
            );
          } else {
            await db.collection(paths.photosCol).add({
              url: compressedBase64,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              title: (file.name || "photo").split(".")[0]
            });
          }
        } catch (err) {
          console.error(err);
          alert("上傳失敗：可能是網路、圖片格式，或 Firestore 規則/大小限制。");
        } finally {
          setIsUploading(false);
          e.target.value = "";
        }
      };

      // ===== 計算月曆格子 =====
      const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
      const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();

      const openDay = (dateKey) => {
        setSelectedDate(dateKey);
        setEditingEvent(events[dateKey] || { location: "", time: "", note: "", type: "work" });
        setIsModalOpen(true);
      };

      const saveDay = async () => {
        try {
          await db.collection(paths.eventsCol).doc(selectedDate).set(editingEvent);
          setIsModalOpen(false);
        } catch (err) {
          console.error(err);
          alert("儲存失敗：請檢查 Firestore 規則（需允許匿名登入寫入）。");
        }
      };

      const deleteDay = async () => {
        if (!confirm("確定刪除此日行程？")) return;
        try {
          await db.collection(paths.eventsCol).doc(selectedDate).delete();
          setIsModalOpen(false);
        } catch (err) {
          console.error(err);
          alert("刪除失敗：請檢查 Firestore 規則。");
        }
      };

      const deletePhoto = async (photoId) => {
        if (!confirm("確定要刪除這張照片嗎？")) return;
        try {
          await db.collection(paths.photosCol).doc(photoId).delete();
        } catch (err) {
          console.error(err);
          alert("刪除失敗：請檢查 Firestore 規則。");
        }
      };

      const openSettings = () => {
        setTempSettings(appSettings);
        setIsSettingsOpen(true);
      };

      const saveSettings = async () => {
        try {
          await db.doc(paths.settingsDoc).set(tempSettings, { merge: true });
          setIsSettingsOpen(false);
        } catch (err) {
          console.error(err);
          alert("更新失敗：請檢查 Firestore 規則。");
        }
      };

      return (
        <div className="min-h-screen bg-[#FFFDFB] flex flex-col items-center py-6 px-4 font-sans">
          <div className="w-full max-w-md bg-white shadow-2xl rounded-[3rem] overflow-hidden border border-orange-50 flex flex-col relative pb-10">

            {isAdmin && (
              <div className="bg-yellow-400 text-[10px] font-black py-1 text-center sticky top-0 z-[60]">
                管理員編輯模式（網址加 ?admin=1）
              </div>
            )}

            {/* 跑馬燈 */}
            <div className="bg-orange-600 text-white py-2 overflow-hidden whitespace-nowrap">
              <div className="flex animate-marquee font-bold text-xs">
                <span className="px-8">{appSettings.marquee}</span>
                <span className="px-8">{appSettings.marquee}</span>
              </div>
            </div>

            {/* 標題與 Logo */}
            <div className="pt-10 pb-6 text-center relative">
              {isAdmin && (
                <button
                  onClick={openSettings}
                  className="absolute top-6 right-6 text-orange-200 hover:text-orange-600 transition-colors"
                  title="品牌設定"
                >
                  ⚙️
                </button>
              )}

              <div className="flex justify-center mb-4">
                <div
                  className={`relative ${isAdmin ? "cursor-pointer" : ""}`}
                  onClick={() => isAdmin && logoInputRef.current && logoInputRef.current.click()}
                  title={isAdmin ? "點擊更換 Logo" : ""}
                >
                  <img
                    src={appSettings.logoUrl}
                    className="w-24 h-24 rounded-[1.6rem] object-cover border-4 border-orange-100 shadow-sm"
                    alt="Logo"
                  />
                  <input
                    type="file"
                    ref={logoInputRef}
                    className="hidden"
                    accept="image/*"
                    onChange={(e) => handleUpload(e, "logo")}
                  />
                  {isAdmin && (
                    <div className="absolute inset-0 bg-black/20 rounded-[1.6rem] flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                      <span className="text-white text-sm font-black">📷</span>
                    </div>
                  )}
                </div>
              </div>

              <h1 className="text-3xl font-black text-gray-800">{appSettings.title}</h1>
              <p className="text-orange-600 text-[10px] font-black tracking-widest uppercase mt-1">
                {appSettings.subtitle}
              </p>
            </div>

            {/* 迷你日曆 */}
            <div className="px-6 py-4 bg-orange-50/30">
              <div className="flex items-center justify-between mb-4">
                <button onClick={() => changeMonth(-1)} className="p-2 text-orange-400 hover:text-orange-600">◀</button>
                <div className="text-lg font-black text-gray-700">
                  {currentDate.getFullYear()}年 {currentDate.getMonth() + 1}月
                </div>
                <button onClick={() => changeMonth(1)} className="p-2 text-orange-400 hover:text-orange-600">▶</button>
              </div>

              <div className="grid grid-cols-7 bg-white rounded-2xl overflow-hidden shadow-sm border border-orange-100">
                {["日","一","二","三","四","五","六"].map((d) => (
                  <div key={d} className="py-2 text-center text-[10px] font-bold text-orange-300">{d}</div>
                ))}

                {Array.from({ length: firstDay }).map((_, i) => (
                  <div key={`empty-${i}`} className="h-14 border-t border-r border-orange-50 bg-gray-50/20"></div>
                ))}

                {Array.from({ length: daysInMonth }).map((_, i) => {
                  const day = i + 1;
                  const dateKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
                  const event = events[dateKey];
                  const isToday =
                    new Date().toDateString() ===
                    new Date(currentDate.getFullYear(), currentDate.getMonth(), day).toDateString();

                  return (
                    <div
                      key={day}
                      onClick={() => openDay(dateKey)}
                      className={`h-14 border-t border-r border-orange-50 p-1 cursor-pointer hover:bg-orange-50 transition-colors relative ${isToday ? "bg-orange-50/50" : ""}`}
                    >
                      <span className={`text-[10px] font-bold ${isToday ? "bg-orange-600 text-white w-4 h-4 flex items-center justify-center rounded-full" : "text-gray-400"}`}>
                        {day}
                      </span>

                      {event && (
                        <div className={`mt-0.5 text-[8px] p-0.5 rounded-sm truncate font-black ${event.type === "work" ? "bg-orange-100 text-orange-700 border-l-2 border-orange-500" : "bg-gray-100 text-gray-400 border-l-2 border-gray-300"}`}>
                          {event.type === "rest" ? "休" : event.location}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* 主要互動區 */}
            <div className="p-8 space-y-8">
              <a
                href={`https://line.me/R/ti/p/~${String(appSettings.lineId || "").replace("@","")}`}
                target="_blank"
                rel="noreferrer"
                className="w-full bg-[#06C755] text-white py-4 rounded-2xl flex items-center justify-center gap-2 font-black shadow-lg active:scale-95 transition-transform"
              >
                💬 LINE 預訂詢問
              </a>

              {/* 公告相簿 */}
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="font-black text-xl italic flex items-center gap-2 text-gray-800">
                    ❤️ 最新公告
                  </h2>

                  {isAdmin && (
                    <button
                      onClick={() => fileInputRef.current && fileInputRef.current.click()}
                      className="text-[10px] bg-black text-white px-4 py-2 rounded-full font-bold active:scale-95 transition-transform"
                    >
                      新增公告
                    </button>
                  )}
                </div>

                <input
                  type="file"
                  ref={fileInputRef}
                  className="hidden"
                  accept="image/*"
                  onChange={(e) => handleUpload(e, "photo")}
                />

                <div className="grid grid-cols-2 gap-3">
                  {photos.length === 0 ? (
                    <div className="col-span-2 py-12 text-center text-gray-300 text-xs font-bold border-2 border-dashed border-gray-100 rounded-3xl">
                      暫無最新公告
                    </div>
                  ) : (
                    photos.map((p) => (
                      <div key={p.id} className="relative aspect-square rounded-2xl overflow-hidden border border-orange-50 bg-gray-50 shadow-sm group">
                        <img src={p.url} className="w-full h-full object-cover" alt="公告" />
                        {isAdmin && (
                          <button
                            onClick={(e) => { e.stopPropagation(); deletePhoto(p.id); }}
                            className="absolute top-2 right-2 bg-red-500/90 text-white p-1.5 rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity"
                            title="刪除公告"
                          >
                            🗑️
                          </button>
                        )}
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          </div>

          {/* 行程彈窗 */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6 z-[100]" onClick={() => setIsModalOpen(false)}>
              <div className="bg-white rounded-[2.5rem] w-full max-w-sm p-8 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-black text-gray-800">{selectedDate}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600">✕</button>
                </div>

                {isAdmin ? (
                  <div className="space-y-4">
                    <div className="flex gap-2 p-1 bg-gray-100 rounded-2xl">
                      <button
                        onClick={() => setEditingEvent({ ...editingEvent, type: "work" })}
                        className={`flex-1 py-3 rounded-xl font-black transition-all ${editingEvent.type === "work" ? "bg-white text-orange-600 shadow-sm" : "text-gray-400"}`}
                      >
                        出攤
                      </button>
                      <button
                        onClick={() => setEditingEvent({ ...editingEvent, type: "rest" })}
                        className={`flex-1 py-3 rounded-xl font-black transition-all ${editingEvent.type === "rest" ? "bg-white text-gray-500 shadow-sm" : "text-gray-400"}`}
                      >
                        店休
                      </button>
                    </div>

                    {editingEvent.type === "work" && (
                      <div className="space-y-3">
                        <input
                          className="w-full p-4 bg-gray-50 rounded-2xl font-bold outline-none focus:ring-2 ring-orange-500"
                          placeholder="擺攤地點"
                          value={editingEvent.location}
                          onChange={(e) => setEditingEvent({ ...editingEvent, location: e.target.value })}
                        />
                        <input
                          className="w-full p-4 bg-gray-50 rounded-2xl font-bold outline-none focus:ring-2 ring-orange-500"
                          placeholder="時間 (例：14:00-完售)"
                          value={editingEvent.time}
                          onChange={(e) => setEditingEvent({ ...editingEvent, time: e.target.value })}
                        />
                      </div>
                    )}

                    <textarea
                      className="w-full p-4 bg-gray-50 rounded-2xl font-bold outline-none h-24 resize-none"
                      placeholder="備註事項"
                      value={editingEvent.note}
                      onChange={(e) => setEditingEvent({ ...editingEvent, note: e.target.value })}
                    />

                    <button
                      onClick={saveDay}
                      className="w-full bg-orange-600 text-white py-4 rounded-2xl font-black shadow-lg active:scale-95 transition-transform"
                    >
                      儲存並發佈
                    </button>

                    <button onClick={deleteDay} className="w-full text-red-500 py-2 text-xs font-bold">
                      刪除此日行程
                    </button>
                  </div>
                ) : (
                  <div className="text-center py-6 space-y-4">
                    {events[selectedDate]?.type === "rest" ? (
                      <div className="space-y-2">
                        <div className="text-3xl font-black text-gray-300 italic">OFF DAY</div>
                        <p className="text-gray-400 font-bold">今日店休，休息是為了走更長的路</p>
                      </div>
                    ) : (
                      <>
                        <div className="bg-orange-50 p-6 rounded-[2rem] border-2 border-orange-100">
                          <div className="text-sm font-black text-orange-400 uppercase tracking-widest mb-2">Location</div>
                          <div className="text-2xl font-black text-orange-600 mb-4">{events[selectedDate]?.location || "當日暫無行程"}</div>
                          {events[selectedDate]?.time && (
                            <>
                              <div className="text-sm font-black text-orange-400 uppercase tracking-widest mb-1">Time</div>
                              <div className="text-lg font-bold text-gray-700">{events[selectedDate].time}</div>
                            </>
                          )}
                        </div>
                        {events[selectedDate]?.note && (
                          <div className="text-sm font-medium text-gray-500 bg-gray-50 p-4 rounded-2xl italic leading-relaxed">
                            「 {events[selectedDate].note} 」
                          </div>
                        )}
                      </>
                    )}

                    <button onClick={() => setIsModalOpen(false)} className="w-full bg-gray-100 text-gray-500 py-4 rounded-2xl font-black mt-4">
                      關閉視窗
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 品牌設定彈窗 */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6 z-[100]" onClick={() => setIsSettingsOpen(false)}>
              <div className="bg-white rounded-[2.5rem] w-full max-w-sm p-8 space-y-5 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-2">
                  <h3 className="text-xl font-black text-gray-800">品牌設定</h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-gray-400">✕</button>
                </div>

                <div className="space-y-1">
                  <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">主標題</label>
                  <input className="w-full p-4 bg-gray-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-orange-500"
                    value={tempSettings.title || ""}
                    onChange={(e) => setTempSettings({ ...tempSettings, title: e.target.value })}
                  />
                </div>

                <div className="space-y-1">
                  <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">副標題</label>
                  <input className="w-full p-4 bg-gray-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-orange-500"
                    value={tempSettings.subtitle || ""}
                    onChange={(e) => setTempSettings({ ...tempSettings, subtitle: e.target.value })}
                  />
                </div>

                <div className="space-y-1">
                  <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">跑馬燈</label>
                  <input className="w-full p-4 bg-gray-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-orange-500"
                    value={tempSettings.marquee || ""}
                    onChange={(e) => setTempSettings({ ...tempSettings, marquee: e.target.value })}
                  />
                </div>

                <div className="space-y-1">
                  <label className="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">LINE ID</label>
                  <input className="w-full p-4 bg-gray-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-orange-500"
                    value={tempSettings.lineId || ""}
                    onChange={(e) => setTempSettings({ ...tempSettings, lineId: e.target.value })}
                  />
                </div>

                <button
                  onClick={saveSettings}
                  className="w-full bg-black text-white py-4 rounded-2xl font-black shadow-xl active:scale-95 transition-transform mt-2"
                >
                  更新資訊
                </button>

                <div className="text-[10px] text-gray-400 font-bold leading-relaxed">
                  小提醒：這是「網址 ?admin=1」的前端管理模式，若要更安全的管理員權限，需要 Firebase Auth/規則做真正的管理員判斷。
                </div>
              </div>
            </div>
          )}

          {/* 上傳中 */}
          {isUploading && (
            <div className="fixed inset-0 bg-white/90 backdrop-blur-md flex flex-col items-center justify-center z-[200]">
              <div className="w-14 h-14 border-4 border-orange-600 border-t-transparent rounded-full animate-spin mb-4 shadow-xl"></div>
              <p className="font-black text-orange-600 animate-pulse tracking-widest">正在同步至島嶼雲端...</p>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
