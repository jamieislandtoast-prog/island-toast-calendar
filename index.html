<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>島嶼生吐司 - 行程公告</title>
    <!-- 使用 Tailwind CSS 加速開發 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Firebase SDK (UMD 版本，避免 require 錯誤) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- 引入 React 與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 引入 Lucide 圖標 (UMD) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FFFDFB; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-33.33%); } }
        .animate-marquee { display: inline-flex; animation: marquee 20s linear infinite; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ed8936; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Firebase 配置 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBiP8A8PrlZd31AdbcF_BPVRz6Q4OymDEc",
            authDomain: "island-toast-app.firebaseapp.com",
            projectId: "island-toast-app",
            storageBucket: "island-toast-app.firebasestorage.app",
            messagingSenderId: "426992761060",
            appId: "1:426992761060:web:4cf940fedbc1fa2a3cd4f1"
        };

        // 使用 Compat 版本初始化 (全域變數 firebase)
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(app);
        const db = firebase.firestore(app);
        const ISLAND_APP_ID = 'island-toast-live';

        // --- Lucide 圖標組件化 (修正後的渲染邏輯) ---
        const Icon = ({ name, size = 24, color = 'currentColor', className = "" }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (window.lucide && window.lucide.icons && window.lucide.icons[name]) {
                    // 使用 Lucide 核心方法建立 SVG
                    const iconNode = window.lucide.icons[name];
                    const svgElement = window.lucide.createElement(iconNode);
                    
                    // 設定屬性
                    svgElement.setAttribute('width', size);
                    svgElement.setAttribute('height', size);
                    svgElement.setAttribute('stroke', color);
                    svgElement.setAttribute('stroke-width', '2.5');
                    svgElement.setAttribute('class', `lucide lucide-${name} ${className}`);

                    if (iconRef.current) {
                        iconRef.current.innerHTML = '';
                        iconRef.current.appendChild(svgElement);
                    }
                }
            }, [name, size, color, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [currentDate, setCurrentDate] = useState(new Date());
            const [events, setEvents] = useState({});
            const [photos, setPhotos] = useState([]);
            const [appSettings, setAppSettings] = useState({
                title: '島嶼生吐司',
                subtitle: '來自大海氣息的蓬鬆柔軟',
                lineId: '@516mdfqz',
                logoUrl: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=200&h=200&auto=format&fit=crop',
                marquee: '🍞 每日新鮮限量現烤，歡迎透過 LINE 提前預約！',
            });

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [selectedDate, setSelectedDate] = useState(null);
            const [editingEvent, setEditingEvent] = useState({ location: '', time: '', note: '', type: 'work' });
            const [tempSettings, setTempSettings] = useState({ ...appSettings });
            const [isUploading, setIsUploading] = useState(false);

            const fileInputRef = useRef(null);
            const logoInputRef = useRef(null);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('admin') === '1') setIsAdmin(true);

                auth.signInAnonymously().catch(console.error);
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;

                // 獲取行程 (Collection 監聽)
                const unsubEvents = db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('events')
                    .onSnapshot((snap) => {
                        const data = {};
                        snap.forEach(d => data[d.id] = d.data());
                        setEvents(data);
                    }, (err) => console.error("Events Load Error:", err));

                // 獲取公告照片 (Collection 監聽)
                const unsubPhotos = db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('photos')
                    .onSnapshot((snap) => {
                        const data = [];
                        snap.forEach(d => data.push({ id: d.id, ...d.data() }));
                        setPhotos(data.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                    }, (err) => console.error("Photos Load Error:", err));

                // 獲取設定 (Document 監聽) - 修正 snap.exists 報錯
                const unsubSettings = db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('settings').doc('general')
                    .onSnapshot((snap) => {
                        // 修正：檢查 snap 是否存在且包含數據
                        if (snap && (typeof snap.exists === 'function' ? snap.exists() : snap.exists)) {
                            setAppSettings(snap.data());
                        }
                    }, (err) => console.error("Settings Load Error:", err));

                return () => {
                    unsubEvents();
                    unsubPhotos();
                    unsubSettings();
                };
            }, [user]);

            const changeMonth = (offset) => {
                const d = new Date(currentDate);
                d.setMonth(currentDate.getMonth() + offset);
                setCurrentDate(d);
            };

            const compressImage = (file, maxWidth = 800) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let w = img.width, h = img.height;
                            if (w > maxWidth) { h = (maxWidth / w) * h; w = maxWidth; }
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            resolve(canvas.toDataURL('image/jpeg', 0.8));
                        };
                    };
                });
            };

            const handleUpload = async (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true);
                try {
                    const base64 = await compressImage(file, type === 'logo' ? 400 : 1200);
                    if (type === 'logo') {
                        await db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('settings').doc('general')
                            .set({ ...appSettings, logoUrl: base64 }, { merge: true });
                    } else {
                        await db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('photos')
                            .add({ url: base64, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    }
                } catch (err) { console.error(err); }
                setIsUploading(false);
                e.target.value = '';
            };

            return (
                <div className="min-h-screen bg-[#FFFDFB] flex flex-col items-center py-6 px-4">
                    <div className="w-full max-w-md bg-white shadow-2xl rounded-[3rem] overflow-hidden border border-orange-50 relative pb-10">
                        
                        {isAdmin && <div className="bg-yellow-400 text-[10px] font-black py-1 text-center sticky top-0 z-[60]">管理員編輯模式 (ADMIN MODE)</div>}

                        <div className="bg-orange-600 text-white py-2.5 overflow-hidden whitespace-nowrap">
                            <div className="flex animate-marquee font-bold text-xs">
                                <span className="px-8">{appSettings.marquee}</span>
                                <span className="px-8">{appSettings.marquee}</span>
                                <span className="px-8">{appSettings.marquee}</span>
                            </div>
                        </div>

                        <div className="pt-10 pb-6 text-center relative px-6">
                            {isAdmin && (
                                <button onClick={() => { setTempSettings(appSettings); setIsSettingsOpen(true); }} className="absolute top-6 right-8 text-orange-200 hover:text-orange-600">
                                    <Icon name="Settings" size={22}/>
                                </button>
                            )}
                            <div className="flex justify-center mb-5">
                                <div className={`relative ${isAdmin ? 'cursor-pointer group' : ''}`} onClick={() => isAdmin && logoInputRef.current.click()}>
                                    <img src={appSettings.logoUrl} className="w-24 h-24 rounded-[1.8rem] object-cover border-4 border-orange-50 shadow-md" />
                                    <input type="file" ref={logoInputRef} className="hidden" accept="image/*" onChange={(e)=>handleUpload(e,'logo')} />
                                    {isAdmin && <div className="absolute inset-0 bg-black/30 rounded-[1.8rem] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="Camera" color="white" /></div>}
                                </div>
                            </div>
                            <h1 className="text-3xl font-black">{appSettings.title}</h1>
                            <p className="text-orange-600 text-[11px] font-black tracking-[0.2em] uppercase mt-2">{appSettings.subtitle}</p>
                        </div>

                        <div className="px-5 py-4 bg-orange-50/20">
                            <div className="flex items-center justify-between mb-4 px-2">
                                <button onClick={() => changeMonth(-1)} className="p-2 text-orange-400"><Icon name="ChevronLeft" size={24}/></button>
                                <div className="text-xl font-black text-gray-700">{currentDate.getFullYear()} / {currentDate.getMonth() + 1}</div>
                                <button onClick={() => changeMonth(1)} className="p-2 text-orange-400"><Icon name="ChevronRight" size={24}/></button>
                            </div>
                            <div className="grid grid-cols-7 bg-white rounded-3xl overflow-hidden shadow-sm border border-orange-100/50">
                                {['日','一','二','三','四','五','六'].map(d => <div key={d} className="py-3 text-center text-[11px] font-bold text-orange-300">{d}</div>)}
                                {Array.from({ length: new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay() }).map((_, i) => <div key={i} className="h-14 border-b border-r border-orange-50/50 bg-slate-50/30"></div>)}
                                {Array.from({ length: new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate() }).map((_, i) => {
                                    const d = i + 1;
                                    const key = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                    const ev = events[key];
                                    const isToday = new Date().toDateString() === new Date(currentDate.getFullYear(), currentDate.getMonth(), d).toDateString();
                                    return (
                                        <div key={d} onClick={() => { setSelectedDate(key); setEditingEvent(ev || { location: '', time: '', note: '', type: 'work' }); setIsModalOpen(true); }}
                                            className="h-16 border-b border-r border-orange-50/50 p-1 cursor-pointer hover:bg-orange-50 relative">
                                            <span className={`text-[10px] font-bold inline-block w-5 h-5 text-center leading-5 rounded-full ${isToday ? 'bg-orange-600 text-white' : 'text-slate-400'}`}>{d}</span>
                                            {ev && <div className={`mt-1 text-[8px] px-1 py-0.5 rounded-sm truncate font-black ${ev.type === 'work' ? 'bg-orange-100 text-orange-800 border-l-2 border-orange-500' : 'bg-slate-100 text-slate-400 border-l-2 border-slate-300'}`}>{ev.type==='rest'?'休':ev.location}</div>}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="p-8 space-y-10">
                            <a href={`https://line.me/R/ti/p/~${appSettings.lineId.replace('@','')}`} target="_blank" className="w-full bg-[#06C755] text-white py-4 rounded-[1.5rem] flex items-center justify-center gap-3 font-black text-lg shadow-xl shadow-green-100 active:scale-95 transition-all">
                                <Icon name="MessageSquare" color="white" /> LINE 預訂詢問
                            </a>
                            <div className="space-y-5">
                                <div className="flex justify-between items-end">
                                    <h2 className="font-black text-2xl italic flex items-center gap-2"><Icon name="Heart" color="#dd6b20" /> 最新公告</h2>
                                    {isAdmin && <button onClick={() => fileInputRef.current.click()} className="text-[10px] bg-slate-900 text-white px-5 py-2.5 rounded-full font-black shadow-lg">上傳公告</button>}
                                </div>
                                <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={(e)=>handleUpload(e,'photo')} />
                                <div className="grid grid-cols-2 gap-4">
                                    {photos.map(p => (
                                        <div key={p.id} className="relative aspect-[4/5] rounded-[1.5rem] overflow-hidden border border-orange-50 shadow-sm group">
                                            <img src={p.url} className="w-full h-full object-cover" />
                                            {isAdmin && <button onClick={async(e)=>{ e.stopPropagation(); if(confirm('刪除？')) await db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('photos').doc(p.id).delete() }} className="absolute top-2 right-2 bg-red-500 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="Trash2" size={14} /></button>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 行程彈窗 */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-6 z-[100]" onClick={() => setIsModalOpen(false)}>
                            <div className="bg-white rounded-[2.5rem] w-full max-w-sm p-8 shadow-2xl" onClick={e => e.stopPropagation()}>
                                <h3 className="text-2xl font-black mb-6">{selectedDate}</h3>
                                {isAdmin ? (
                                    <div className="space-y-4">
                                        <div className="flex gap-2 p-1.5 bg-slate-100 rounded-2xl">
                                            <button onClick={()=>setEditingEvent({...editingEvent, type:'work'})} className={`flex-1 py-3 rounded-xl font-black ${editingEvent.type==='work'?'bg-white text-orange-600 shadow-md':'text-slate-400'}`}>出攤</button>
                                            <button onClick={()=>setEditingEvent({...editingEvent, type:'rest'})} className={`flex-1 py-3 rounded-xl font-black ${editingEvent.type==='rest'?'bg-white text-slate-600 shadow-md':'text-slate-400'}`}>店休</button>
                                        </div>
                                        <input className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" placeholder="地點" value={editingEvent.location} onChange={e=>setEditingEvent({...editingEvent, location:e.target.value})} />
                                        <input className="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none" placeholder="時間" value={editingEvent.time} onChange={e=>setEditingEvent({...editingEvent, time:e.target.value})} />
                                        <button onClick={async()=>{ await db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('events').doc(selectedDate).set(editingEvent); setIsModalOpen(false); }} className="w-full bg-orange-600 text-white py-4 rounded-[1.2rem] font-black shadow-xl">儲存並發佈</button>
                                    </div>
                                ) : (
                                    <div className="text-center py-4">
                                        {events[selectedDate] ? (
                                            <div className="bg-orange-50 p-6 rounded-[2rem] border-2 border-orange-100">
                                                <div className="text-2xl font-black text-slate-800">{events[selectedDate].type==='rest'?'店休中':events[selectedDate].location}</div>
                                                <div className="text-slate-500 font-bold mt-2">{events[selectedDate].time}</div>
                                            </div>
                                        ) : <div className="text-slate-300 font-bold">當日尚無行程安排</div>}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 設定彈窗 */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-6 z-[110]" onClick={() => setIsSettingsOpen(false)}>
                            <div className="bg-white rounded-[2.5rem] w-full max-w-sm p-8 space-y-4" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-black">品牌設定</h3>
                                <input className="w-full p-4 bg-slate-50 rounded-2xl font-bold" value={tempSettings.title} onChange={e=>setTempSettings({...tempSettings, title:e.target.value})} placeholder="品牌名" />
                                <input className="w-full p-4 bg-slate-50 rounded-2xl font-bold" value={tempSettings.marquee} onChange={e=>setTempSettings({...tempSettings, marquee:e.target.value})} placeholder="跑馬燈" />
                                <button onClick={async()=>{ await db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('settings').doc('general').set(tempSettings); setIsSettingsOpen(false); }} className="w-full bg-slate-900 text-white py-4 rounded-[1.2rem] font-black">同步更新</button>
                            </div>
                        </div>
                    )}

                    {isUploading && (
                        <div className="fixed inset-0 bg-white/80 backdrop-blur-lg flex items-center justify-center z-[200]">
                            <p className="font-black text-slate-800 animate-pulse">島嶼雲端同步中...</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
