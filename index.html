<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>島嶼生吐司 - 官方網站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fcfcfc; color: #333; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-33.33%); } }
        .animate-marquee { display: inline-flex; animation: marquee 25s linear infinite; }
        .calendar-grid { display: grid; grid-template-columns: 2.5rem repeat(7, 1fr); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBiP8A8PrlZd31AdbcF_BPVRz6Q4OymDEc",
            authDomain: "island-toast-app.firebaseapp.com",
            projectId: "island-toast-app",
            storageBucket: "island-toast-app.firebasestorage.app",
            messagingSenderId: "426992761060",
            appId: "1:426992761060:web:4cf940fedbc1fa2a3cd4f1"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(app);
        const db = firebase.firestore(app);
        const ISLAND_APP_ID = 'island-toast-live';
        const LINE_ID = '@516mdfqz';

        const Icon = ({ name, size = 24, color = 'currentColor', className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    const iconNode = window.lucide.icons[name];
                    const svg = window.lucide.createElement(iconNode);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    svg.setAttribute('stroke', color);
                    svg.setAttribute('stroke-width', '2.5');
                    svg.setAttribute('class', `lucide lucide-${name} ${className}`);
                    if (iconRef.current) { iconRef.current.innerHTML = ''; iconRef.current.appendChild(svg); }
                }
            }, [name, size, color, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        function App() {
            const [activeTab, setActiveTab] = useState('home'); // 'home', 'menu', 'news'
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [viewMode, setViewMode] = useState('month');
            const [currentDate, setCurrentDate] = useState(new Date());
            const [events, setEvents] = useState({});
            const [photos, setPhotos] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedDate, setSelectedDate] = useState(null);
            const [editingEvent, setEditingEvent] = useState({ location: '', address: '', time: '', type: 'work' });
            const [zoomImg, setZoomImg] = useState(null);

            // 預設菜單資料
            const menuItems = [
                { name: '經典原味生吐司', price: '150', tag: '招牌', desc: '純鮮奶製作，極致柔軟' },
                { name: '法芙娜可可生吐司', price: '180', tag: '人氣', desc: '進口法芙娜巧克力，濃郁不甜膩' },
                { name: '小山園抹茶生吐司', price: '200', tag: '限量', desc: '日本直送抹茶粉，帶有淡淡茶香' }
            ];

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('admin') === '1') setIsAdmin(true);
                auth.signInAnonymously().catch(console.error);
                const unsubscribe = auth.onAuthStateChanged(u => setUser(u));
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubEvents = db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('events')
                    .onSnapshot(snap => {
                        const data = {};
                        snap.forEach(d => data[d.id] = d.data());
                        setEvents(data);
                    });
                const unsubPhotos = db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('photos')
                    .onSnapshot(snap => {
                        const data = [];
                        snap.forEach(d => data.push({ id: d.id, ...d.data() }));
                        setPhotos(data);
                    });
                return () => { unsubEvents(); unsubPhotos(); };
            }, [user]);

            const formatDateKey = (date) => {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            };

            const getWeekNumber = (date) => {
                const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
                const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
                return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
            };

            const changeMonth = (offset) => {
                const d = new Date(currentDate);
                d.setMonth(currentDate.getMonth() + offset);
                setCurrentDate(d);
            };

            const changeWeek = (offset) => {
                const d = new Date(currentDate);
                d.setDate(currentDate.getDate() + (offset * 7));
                setCurrentDate(d);
            };

            const weekDays = useMemo(() => {
                const start = new Date(currentDate);
                start.setDate(currentDate.getDate() - currentDate.getDay());
                return Array.from({ length: 7 }, (_, i) => {
                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    return d;
                });
            }, [currentDate]);

            // 上傳相片 Mock
            const handleUploadPhoto = () => {
                const url = prompt("請輸入相片網址 (例如來自 Unsplash 或 Imgur):");
                if (url) {
                    db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('photos').add({
                        url,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            };

            const renderHome = () => (
                <div className="pb-24">
                    {/* Header */}
                    <div className="pt-12 pb-6 flex flex-col items-center">
                        <div className="relative">
                            <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=200" className="w-20 h-20 rounded-[1.5rem] object-cover shadow-lg border-2 border-white" />
                            <div className="absolute -bottom-1 -right-1 bg-green-500 w-5 h-5 rounded-full border-2 border-white"></div>
                        </div>
                        <h1 className="text-2xl font-black text-gray-800 mt-3">島嶼生吐司</h1>
                        <p className="text-orange-500 font-black text-[9px] tracking-[0.4em] uppercase">Island Toast</p>
                    </div>

                    {/* View Switch */}
                    <div className="px-6 flex gap-2 mb-4">
                        <button onClick={() => setViewMode('month')} className={`flex-1 py-3 rounded-2xl font-black text-xs transition-all flex items-center justify-center gap-2 ${viewMode === 'month' ? 'bg-orange-500 text-white shadow-lg shadow-orange-100' : 'bg-white border border-gray-100 text-gray-400'}`}>
                            <Icon name="Calendar" size={14} /> 全月月曆
                        </button>
                        <button onClick={() => setViewMode('week')} className={`flex-1 py-3 rounded-2xl font-black text-xs transition-all flex items-center justify-center gap-2 ${viewMode === 'week' ? 'bg-orange-500 text-white shadow-lg shadow-orange-100' : 'bg-white border border-gray-100 text-gray-400'}`}>
                            <Icon name="Layout" size={14} /> 週行程表
                        </button>
                    </div>

                    {/* Calendar Section */}
                    <div className="px-4">
                        <div className="bg-white rounded-[2.5rem] border border-gray-100 overflow-hidden shadow-sm">
                            <div className="flex items-center justify-between p-5 bg-orange-50/30">
                                <button onClick={() => viewMode === 'month' ? changeMonth(-1) : changeWeek(-1)} className="p-1 text-orange-500"><Icon name="ChevronLeft" size={20}/></button>
                                <div className="text-center">
                                    <div className="font-black text-gray-800">{viewMode === 'month' ? `${currentDate.getFullYear()} 年 ${currentDate.getMonth() + 1} 月` : `W${getWeekNumber(currentDate)} 每週行程`}</div>
                                    {viewMode === 'week' && <div className="text-[10px] text-gray-400 font-bold">{formatDateKey(weekDays[0])} ~ {formatDateKey(weekDays[6])}</div>}
                                </div>
                                <button onClick={() => viewMode === 'month' ? changeMonth(1) : changeWeek(1)} className="p-1 text-orange-500"><Icon name="ChevronRight" size={20}/></button>
                            </div>

                            {viewMode === 'month' ? (
                                <div className="p-2">
                                    <div className="calendar-grid text-center mb-1">
                                        <div className="text-[8px] font-black text-gray-300 py-1">WK</div>
                                        {['日','一','二','三','四','五','六'].map(d => <div key={d} className="text-[10px] font-bold text-gray-400 py-1">{d}</div>)}
                                    </div>
                                    {/* Month Rows Logic */}
                                    {(() => {
                                        const year = currentDate.getFullYear();
                                        const month = currentDate.getMonth();
                                        const firstDay = new Date(year, month, 1).getDay();
                                        const daysInMonth = new Date(year, month + 1, 0).getDate();
                                        const rows = [];
                                        let day = 1;
                                        for (let i = 0; i < 6; i++) {
                                            const cells = [];
                                            const rowDate = new Date(year, month, day - firstDay);
                                            cells.push(<div key={`w-${i}`} className="flex items-center justify-center text-[8px] font-black text-gray-300">{getWeekNumber(rowDate)}</div>);
                                            for (let j = 0; j < 7; j++) {
                                                const idx = i * 7 + j;
                                                const dNum = idx - firstDay + 1;
                                                if (dNum > 0 && dNum <= daysInMonth) {
                                                    const dk = `${year}-${String(month+1).padStart(2,'0')}-${String(dNum).padStart(2,'0')}`;
                                                    const ev = events[dk];
                                                    const isToday = new Date().toDateString() === new Date(year, month, dNum).toDateString();
                                                    cells.push(
                                                        <div key={dk} onClick={() => { setSelectedDate(dk); setEditingEvent(ev || {location:'', address:'', time:'', type:'work'}); setIsModalOpen(true); }} className={`h-12 border-t border-gray-50 flex flex-col items-center justify-center cursor-pointer hover:bg-orange-50 transition-all ${isToday ? 'bg-orange-50/50' : ''}`}>
                                                            <span className={`text-[10px] font-bold ${isToday ? 'text-orange-500' : 'text-gray-400'}`}>{dNum}</span>
                                                            {ev && <div className={`w-1 h-1 rounded-full mt-0.5 ${ev.type === 'rest' ? 'bg-gray-300' : 'bg-orange-500'}`}></div>}
                                                        </div>
                                                    );
                                                } else {
                                                    cells.push(<div key={`e-${idx}`} className="h-12 border-t border-gray-50"></div>);
                                                }
                                            }
                                            rows.push(<div key={`r-${i}`} className="calendar-grid">{cells}</div>);
                                            day += 7;
                                            if (day - firstDay > daysInMonth) break;
                                        }
                                        return rows;
                                    })()}
                                </div>
                            ) : (
                                <div className="p-4 space-y-3 bg-gray-50/50">
                                    {weekDays.map(date => {
                                        const dk = formatDateKey(date);
                                        const ev = events[dk];
                                        return (
                                            <div key={dk} className="flex gap-3 bg-white p-3 rounded-2xl border border-gray-100 items-center shadow-sm">
                                                <div className="flex flex-col items-center justify-center min-w-[40px]">
                                                    <div className="text-[10px] font-bold text-gray-400">{["日", "一", "二", "三", "四", "五", "六"][date.getDay()]}</div>
                                                    <div className="text-lg font-black text-gray-700">{date.getDate()}</div>
                                                </div>
                                                <div className="flex-1">
                                                    {ev ? (
                                                        <div className="flex flex-col">
                                                            <div className={`text-sm font-black ${ev.type==='rest'?'text-gray-300':'text-gray-800'}`}>{ev.type==='rest'?'今日店休 REST DAY':ev.location}</div>
                                                            {ev.type==='work' && <div className="text-[10px] text-orange-500 font-bold mt-0.5">{ev.time || '14:00 - 完售'}</div>}
                                                        </div>
                                                    ) : <div className="text-[10px] text-gray-300">暫無安排行程</div>}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* News / Photos Section on Home */}
                    <div className="px-6 mt-8">
                        <div className="flex justify-between items-end mb-4">
                            <h2 className="text-lg font-black text-gray-800">最新動態 <span className="text-orange-500 text-[10px] ml-1 uppercase">News</span></h2>
                            {isAdmin && <button onClick={handleUploadPhoto} className="text-xs font-bold text-orange-500 flex items-center gap-1"><Icon name="PlusCircle" size={14}/> 上傳相片</button>}
                        </div>
                        <div className="flex gap-4 overflow-x-auto hide-scrollbar pb-4 -mx-2 px-2">
                            {photos.length > 0 ? photos.map(p => (
                                <div key={p.id} onClick={() => setZoomImg(p.url)} className="min-w-[140px] h-[180px] rounded-3xl overflow-hidden shadow-lg border-2 border-white relative group">
                                    <img src={p.url} className="w-full h-full object-cover transition-transform group-hover:scale-110" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                                </div>
                            )) : (
                                [1,2,3].map(i => <div key={i} className="min-w-[140px] h-[180px] rounded-3xl bg-gray-100 flex items-center justify-center text-gray-300 font-bold text-xs italic">Coming Soon</div>)
                            )}
                        </div>
                    </div>
                </div>
            );

            const renderMenu = () => (
                <div className="px-6 pb-24 pt-12">
                    <h2 className="text-3xl font-black text-gray-800 mb-1">精選菜單</h2>
                    <p className="text-orange-500 font-black text-[10px] tracking-widest uppercase mb-8">Island Toast Menu</p>
                    
                    <div className="space-y-4">
                        {menuItems.map((item, idx) => (
                            <div key={idx} className="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm flex justify-between items-center group active:scale-[0.98] transition-all">
                                <div>
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className="bg-orange-100 text-orange-600 text-[9px] font-black px-2 py-0.5 rounded-full">{item.tag}</span>
                                        <h3 className="font-black text-gray-800">{item.name}</h3>
                                    </div>
                                    <p className="text-[10px] text-gray-400 font-medium">{item.desc}</p>
                                </div>
                                <div className="text-right">
                                    <div className="text-sm font-black text-gray-800">${item.price}</div>
                                    <div className="text-[8px] text-gray-300 font-bold">LIMITED</div>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="mt-8 p-6 bg-orange-500 rounded-[2.5rem] text-white flex items-center justify-between">
                        <div>
                            <div className="font-black text-lg leading-tight">現在預訂</div>
                            <div className="text-[10px] opacity-80 font-bold mt-1">享每週限定優惠</div>
                        </div>
                        <a href={`https://line.me/R/ti/p/${LINE_ID}`} target="_blank" className="bg-white text-orange-500 px-6 py-3 rounded-2xl font-black text-xs shadow-lg">前往 LINE</a>
                    </div>
                </div>
            );

            const renderNews = () => (
                <div className="px-6 pb-24 pt-12">
                    <h2 className="text-3xl font-black text-gray-800 mb-1">生活風格</h2>
                    <p className="text-orange-500 font-black text-[10px] tracking-widest uppercase mb-8">Island Life & News</p>
                    
                    <div className="grid grid-cols-2 gap-3">
                        {photos.map(p => (
                            <div key={p.id} onClick={() => setZoomImg(p.url)} className="aspect-[4/5] rounded-[2rem] overflow-hidden bg-gray-100 shadow-md">
                                <img src={p.url} className="w-full h-full object-cover" />
                            </div>
                        ))}
                        {photos.length === 0 && <div className="col-span-2 py-20 text-center text-gray-300 font-bold italic">目前尚無照片更新</div>}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col items-center">
                    <div className="w-full max-w-md min-h-screen bg-[#fcfcfc] relative overflow-x-hidden">
                        
                        {/* 跑馬燈 */}
                        <div className="bg-gray-800 text-white py-1.5 overflow-hidden sticky top-0 z-[60]">
                            <div className="animate-marquee whitespace-nowrap font-bold text-[9px] tracking-widest uppercase">
                                <span className="px-8">🍞 每日新鮮限量現烤，預訂請洽 LINE @516mdfqz</span>
                                <span className="px-8">🍞 追蹤我們獲取最新市集出攤資訊！</span>
                                <span className="px-8">🍞 每日新鮮限量現烤，預訂請洽 LINE @516mdfqz</span>
                            </div>
                        </div>

                        {/* Main Content Area */}
                        {activeTab === 'home' && renderHome()}
                        {activeTab === 'menu' && renderMenu()}
                        {activeTab === 'news' && renderNews()}

                        {/* Bottom Nav */}
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-[350px] glass-nav h-20 rounded-[2.5rem] shadow-2xl border border-white/50 z-[70] flex items-center justify-around px-4">
                            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center transition-all ${activeTab === 'home' ? 'text-orange-500 scale-110' : 'text-gray-300'}`}>
                                <Icon name="Home" size={22} />
                                <span className="text-[9px] font-black mt-1">首頁</span>
                            </button>
                            <button onClick={() => setActiveTab('menu')} className={`flex flex-col items-center transition-all ${activeTab === 'menu' ? 'text-orange-500 scale-110' : 'text-gray-300'}`}>
                                <Icon name="Coffee" size={22} />
                                <span className="text-[9px] font-black mt-1">菜單</span>
                            </button>
                            <button onClick={() => setActiveTab('news')} className={`flex flex-col items-center transition-all ${activeTab === 'news' ? 'text-orange-500 scale-110' : 'text-gray-300'}`}>
                                <Icon name="Image" size={22} />
                                <span className="text-[9px] font-black mt-1">消息</span>
                            </button>
                        </div>
                    </div>

                    {/* Image Zoom Modal */}
                    {zoomImg && (
                        <div className="fixed inset-0 bg-black/95 z-[200] flex items-center justify-center p-4" onClick={() => setZoomImg(null)}>
                            <img src={zoomImg} className="max-w-full max-h-full rounded-2xl shadow-2xl" />
                        </div>
                    )}

                    {/* Date Details / Edit Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6 z-[150]" onClick={() => setIsModalOpen(false)}>
                            <div className="bg-white rounded-[3rem] w-full max-w-sm p-8" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-black text-gray-800 mb-6">{selectedDate} 詳細行程</h3>
                                {isAdmin ? (
                                    <div className="space-y-4">
                                        <div className="flex bg-gray-100 p-1.5 rounded-2xl">
                                            <button onClick={()=>setEditingEvent({...editingEvent, type:'work'})} className={`flex-1 py-3 rounded-xl font-black text-xs ${editingEvent.type==='work'?'bg-white shadow text-orange-600':'text-gray-400'}`}>市集出攤</button>
                                            <button onClick={()=>setEditingEvent({...editingEvent, type:'rest'})} className={`flex-1 py-3 rounded-xl font-black text-xs ${editingEvent.type==='rest'?'bg-white shadow text-gray-600':'text-gray-400'}`}>今日店休</button>
                                        </div>
                                        {editingEvent.type === 'work' && (
                                            <>
                                                <input className="w-full bg-gray-50 p-4 rounded-2xl font-bold text-sm outline-none border border-gray-100" placeholder="地點 (e.g. 台南美術館)" value={editingEvent.location} onChange={e=>setEditingEvent({...editingEvent, location:e.target.value})} />
                                                <input className="w-full bg-gray-50 p-4 rounded-2xl font-bold text-sm outline-none border border-gray-100" placeholder="時間" value={editingEvent.time} onChange={e=>setEditingEvent({...editingEvent, time:e.target.value})} />
                                            </>
                                        )}
                                        <button onClick={async()=>{
                                            await db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('events').doc(selectedDate).set(editingEvent);
                                            setIsModalOpen(false);
                                        }} className="w-full bg-orange-500 text-white py-4 rounded-2xl font-black shadow-lg">更新行程</button>
                                    </div>
                                ) : (
                                    <div className="text-center py-6">
                                        {events[selectedDate] ? (
                                            <div className="space-y-4">
                                                <div className="text-2xl font-black text-gray-800">{events[selectedDate].type === 'rest' ? '今日店休' : events[selectedDate].location}</div>
                                                <div className="text-orange-500 font-bold">{events[selectedDate].time || '14:00 - 完售'}</div>
                                            </div>
                                        ) : <div className="text-gray-300 font-bold italic">尚無預定行程</div>}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
