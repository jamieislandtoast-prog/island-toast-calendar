<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>島嶼生吐司 - 官方網站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8f8f8; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-33.33%); } }
        .animate-marquee { display: inline-flex; animation: marquee 25s linear infinite; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } body { background: white; } .shadow-2xl { shadow: none; } }
        /* 隱藏滾動條但保持功能 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBiP8A8PrlZd31AdbcF_BPVRz6Q4OymDEc",
            authDomain: "island-toast-app.firebaseapp.com",
            projectId: "island-toast-app",
            storageBucket: "island-toast-app.firebasestorage.app",
            messagingSenderId: "426992761060",
            appId: "1:426992761060:web:4cf940fedbc1fa2a3cd4f1"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(app);
        const db = firebase.firestore(app);
        const ISLAND_APP_ID = 'island-toast-live';
        const FIXED_LINE_ID = '@516mdfqz'; // 固定 LINE ID
        const LINE_URL = `https://line.me/R/ti/p/${FIXED_LINE_ID}`; // 帶入 ID 的 QR Code 連結邏輯

        const Icon = ({ name, size = 24, color = 'currentColor', className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    const iconNode = window.lucide.icons[name];
                    const svg = window.lucide.createElement(iconNode);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    svg.setAttribute('stroke', color);
                    svg.setAttribute('stroke-width', '2.5');
                    svg.setAttribute('class', `lucide lucide-${name} ${className}`);
                    if (iconRef.current) { iconRef.current.innerHTML = ''; iconRef.current.appendChild(svg); }
                }
            }, [name, size, color, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [currentDate, setCurrentDate] = useState(new Date());
            const [events, setEvents] = useState({});
            const [photos, setPhotos] = useState([]);
            const [appSettings, setAppSettings] = useState({
                title: '島嶼生吐司',
                subtitle: 'ISLAND TOAST',
                marquee: '🍞 每日新鮮限量現烤，歡迎透過 LINE 提前預約！',
                logoUrl: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=200'
            });

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [selectedDate, setSelectedDate] = useState(null);
            const [editingEvent, setEditingEvent] = useState({ location: '', time: '', note: '', type: 'work' });
            const [zoomImg, setZoomImg] = useState(null);
            const [isUploading, setIsUploading] = useState(false);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('admin') === '1') setIsAdmin(true);
                auth.signInAnonymously().catch(console.error);
                const unsubscribe = auth.onAuthStateChanged(u => setUser(u));
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubEvents = db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('events')
                    .onSnapshot(snap => {
                        const data = {};
                        snap.forEach(d => data[d.id] = d.data());
                        setEvents(data);
                    });
                const unsubPhotos = db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('photos')
                    .onSnapshot(snap => {
                        const data = [];
                        snap.forEach(d => data.push({ id: d.id, ...d.data() }));
                        setPhotos(data.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                    });
                const unsubSettings = db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('settings').doc('general')
                    .onSnapshot(snap => {
                        if (snap && snap.exists) setAppSettings(snap.data());
                    });
                return () => { unsubEvents(); unsubPhotos(); unsubSettings(); };
            }, [user]);

            const changeMonth = (offset) => {
                const d = new Date(currentDate);
                d.setMonth(currentDate.getMonth() + offset);
                setCurrentDate(d);
            };

            const handleUpload = async (e) => {
                if (photos.length >= 5) { alert('最多僅能上傳 5 張公告照片'); return; }
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async (ev) => {
                    await db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('photos')
                        .add({ url: ev.target.result, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    setIsUploading(false);
                };
            };

            const takeScreenshot = () => { window.print(); };

            const renderCalendar = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(<div key={`empty-${i}`} className="h-16 bg-gray-50/30"></div>);
                for (let d = 1; d <= daysInMonth; d++) {
                    const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const ev = events[key];
                    const isToday = new Date().toDateString() === new Date(year, month, d).toDateString();
                    days.push(
                        <div key={d} onClick={() => { setSelectedDate(key); setEditingEvent(ev || { location: '', time: '', note: '', type: 'work' }); setIsModalOpen(true); }}
                            className="h-16 border-t border-r border-gray-100 p-1 cursor-pointer hover:bg-orange-50 transition-colors relative">
                            <span className={`text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full ${isToday ? 'bg-orange-500 text-white' : 'text-gray-400'}`}>{d}</span>
                            {ev && <div className={`mt-1 text-[8px] p-0.5 rounded-sm truncate font-bold border-l-2 ${ev.type === 'work' ? 'bg-orange-100 text-orange-700 border-orange-500' : 'bg-gray-100 text-gray-400 border-gray-300'}`}>{ev.type === 'rest' ? '休' : ev.location}</div>}
                        </div>
                    );
                }
                return days;
            };

            return (
                <div className="min-h-screen py-4 px-2 flex flex-col items-center">
                    <div className="w-full max-w-md bg-white shadow-2xl rounded-[2.5rem] overflow-hidden relative">
                        {/* 頂部按鈕 */}
                        <div className="absolute top-6 right-6 flex gap-3 z-50 no-print">
                            <button onClick={takeScreenshot} title="截圖" className="p-2 bg-white/80 backdrop-blur rounded-full shadow-sm text-gray-600 hover:text-orange-500">
                                <Icon name="Camera" size={20} />
                            </button>
                            {isAdmin && (
                                <button onClick={() => setIsSettingsOpen(true)} className="p-2 bg-white/80 backdrop-blur rounded-full shadow-sm text-gray-600 hover:text-orange-500">
                                    <Icon name="Settings" size={20} />
                                </button>
                            )}
                        </div>

                        {/* 跑馬燈公告 */}
                        <div className="bg-orange-600 text-white py-2 overflow-hidden">
                            <div className="animate-marquee whitespace-nowrap font-bold text-xs">
                                <span className="px-10">{appSettings.marquee}</span>
                                <span className="px-10">{appSettings.marquee}</span>
                                <span className="px-10">{appSettings.marquee}</span>
                            </div>
                        </div>

                        {/* 品牌 Logo */}
                        <div className="pt-12 pb-6 flex flex-col items-center">
                            <img src={appSettings.logoUrl} className="w-24 h-24 rounded-3xl object-cover shadow-lg border-4 border-white mb-4" />
                            <h1 className="text-3xl font-black text-gray-800 tracking-tight">{appSettings.title}</h1>
                            <p className="text-orange-500 font-black text-[10px] tracking-[0.3em] uppercase mt-1">{appSettings.subtitle}</p>
                        </div>

                        {/* 日曆區塊 */}
                        <div className="px-4 pb-6">
                            <div className="bg-white rounded-[2rem] border border-gray-100 overflow-hidden shadow-sm">
                                <div className="flex items-center justify-between p-4 bg-orange-50/50">
                                    <button onClick={() => changeMonth(-1)} className="p-1 no-print"><Icon name="ChevronLeft" color="#f97316"/></button>
                                    <span className="font-black text-gray-700">{currentDate.getFullYear()} 年 {currentDate.getMonth() + 1} 月</span>
                                    <button onClick={() => changeMonth(1)} className="p-1 no-print"><Icon name="ChevronRight" color="#f97316"/></button>
                                </div>
                                {/* 週次標題 */}
                                <div className="grid grid-cols-7 text-center border-t border-gray-100">
                                    {['日','一','二','三','四','五','六'].map(d => <div key={d} className="py-2 text-[10px] font-bold text-gray-400 bg-gray-50/30 border-r border-gray-100 last:border-0">{d}</div>)}
                                </div>
                                <div className="grid grid-cols-7 border-l border-gray-100">
                                    {renderCalendar()}
                                </div>
                            </div>
                        </div>

                        {/* 行動呼籲與相簿 */}
                        <div className="px-6 pb-10 space-y-6">
                            <a href={LINE_URL} target="_blank" className="flex items-center justify-center gap-3 bg-[#06C755] text-white py-4 rounded-2xl font-black text-lg no-print transition-transform active:scale-95 shadow-lg shadow-green-100">
                                <Icon name="MessageSquare" color="white" /> LINE 預訂 ({FIXED_LINE_ID})
                            </a>

                            <div className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="font-black text-xl flex items-center gap-2"><Icon name="Image" color="#f97316" /> 公告相簿 ({photos.length}/5)</h2>
                                    {isAdmin && photos.length < 5 && (
                                        <label className="bg-gray-800 text-white text-[10px] px-4 py-2 rounded-full font-bold cursor-pointer hover:bg-gray-700">
                                            上傳照片 <input type="file" className="hidden" onChange={handleUpload} accept="image/*" />
                                        </label>
                                    )}
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    {photos.map(p => (
                                        <div key={p.id} className="relative aspect-square rounded-2xl overflow-hidden group border border-gray-100 shadow-sm cursor-pointer" onClick={() => setZoomImg(p.url)}>
                                            <img src={p.url} className="w-full h-full object-cover" />
                                            {isAdmin && (
                                                <button onClick={async(e) => { e.stopPropagation(); if(confirm('確定刪除？')) await db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('photos').doc(p.id).delete(); }} className="absolute top-2 right-2 bg-red-500/80 text-white p-1.5 rounded-full no-print">
                                                    <Icon name="X" size={14} />
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                    {photos.length === 0 && <div className="col-span-2 py-10 text-center text-gray-300 font-bold border-2 border-dashed border-gray-100 rounded-2xl">暫無照片</div>}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 行程彈窗 */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6 z-[100] no-print" onClick={() => setIsModalOpen(false)}>
                            <div className="bg-white rounded-[2.5rem] w-full max-w-xs p-8 shadow-2xl scale-up-center" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-black text-gray-800 mb-6 border-l-4 border-orange-500 pl-3">{selectedDate}</h3>
                                {isAdmin ? (
                                    <div className="space-y-4">
                                        <div className="flex bg-gray-100 p-1 rounded-xl">
                                            <button onClick={()=>setEditingEvent({...editingEvent, type:'work'})} className={`flex-1 py-2 rounded-lg font-bold ${editingEvent.type==='work'?'bg-white shadow text-orange-600':'text-gray-400'}`}>出攤</button>
                                            <button onClick={()=>setEditingEvent({...editingEvent, type:'rest'})} className={`flex-1 py-2 rounded-lg font-bold ${editingEvent.type==='rest'?'bg-white shadow text-gray-600':'text-gray-400'}`}>店休</button>
                                        </div>
                                        {editingEvent.type === 'work' && (
                                            <>
                                                <input className="w-full bg-gray-50 p-4 rounded-xl font-bold border border-gray-100 focus:border-orange-500 outline-none" placeholder="出攤地點" value={editingEvent.location} onChange={e=>setEditingEvent({...editingEvent, location:e.target.value})} />
                                                <input className="w-full bg-gray-50 p-4 rounded-xl font-bold border border-gray-100 focus:border-orange-500 outline-none" placeholder="營業時間 (例: 14:00-完售)" value={editingEvent.time} onChange={e=>setEditingEvent({...editingEvent, time:e.target.value})} />
                                            </>
                                        )}
                                        <button onClick={async()=>{ await db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('events').doc(selectedDate).set(editingEvent); setIsModalOpen(false); }} className="w-full bg-orange-500 text-white py-4 rounded-xl font-black shadow-lg">儲存行程</button>
                                    </div>
                                ) : (
                                    <div className="text-center">
                                        {events[selectedDate] ? (
                                            <div className="space-y-6">
                                                <div className="py-6 px-4 bg-orange-50 rounded-2xl">
                                                    <div className="text-2xl font-black text-gray-800">{events[selectedDate].type === 'rest' ? '今日店休' : events[selectedDate].location}</div>
                                                    <div className="text-orange-500 font-bold mt-2">{events[selectedDate].time || '營業時間待定'}</div>
                                                </div>
                                                {events[selectedDate].type === 'work' && events[selectedDate].location && (
                                                    <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(events[selectedDate].location)}`} target="_blank" className="flex items-center justify-center gap-2 w-full bg-blue-500 text-white py-4 rounded-xl font-black shadow-lg shadow-blue-100">
                                                        <Icon name="MapPin" color="white" /> 前往 Google 地圖
                                                    </a>
                                                )}
                                            </div>
                                        ) : <p className="text-gray-300 font-bold py-4">這天還沒有排程喔！</p>}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 圖片燈箱放大 */}
                    {zoomImg && (
                        <div className="fixed inset-0 bg-black/95 z-[200] flex items-center justify-center p-4 no-print" onClick={() => setZoomImg(null)}>
                            <img src={zoomImg} className="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain" />
                            <button className="absolute top-10 right-10 text-white bg-white/10 p-2 rounded-full hover:bg-white/20"><Icon name="X" size={32}/></button>
                            <div className="absolute bottom-10 text-white/50 text-sm font-bold">點擊任意處關閉</div>
                        </div>
                    )}

                    {/* 網站管理設定 */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-6 z-[110]" onClick={() => setIsSettingsOpen(false)}>
                            <div className="bg-white rounded-[2rem] w-full max-w-xs p-8 space-y-4" onClick={e => e.stopPropagation()}>
                                <h3 className="font-black text-xl border-b pb-4">網站設定</h3>
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-gray-400">品牌名稱</label>
                                    <input className="w-full bg-gray-50 p-3 rounded-lg font-bold border border-gray-100" value={appSettings.title} onChange={e=>setAppSettings({...appSettings, title:e.target.value})} />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-gray-400">跑馬燈公告</label>
                                    <textarea className="w-full bg-gray-50 p-3 rounded-lg font-bold border border-gray-100 h-24" value={appSettings.marquee} onChange={e=>setAppSettings({...appSettings, marquee:e.target.value})} />
                                </div>
                                <button onClick={async()=>{ await db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('settings').doc('general').set(appSettings); setIsSettingsOpen(false); }} className="w-full bg-gray-800 text-white py-4 rounded-xl font-black">儲存設定</button>
                            </div>
                        </div>
                    )}

                    {/* 上傳中遮罩 */}
                    {isUploading && (
                        <div className="fixed inset-0 bg-white/60 backdrop-blur-sm flex items-center justify-center z-[300]">
                            <div className="text-center p-8 bg-white rounded-3xl shadow-xl">
                                <div className="w-12 h-12 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                                <p className="font-black text-gray-800">上傳處理中...</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
