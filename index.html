<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>島嶼生吐司 - 官方網站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8f8f8; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-33.33%); } }
        .animate-marquee { display: inline-flex; animation: marquee 25s linear infinite; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } body { background: white; } }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .calendar-grid { display: grid; grid-template-columns: 2.5rem repeat(7, 1fr); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBiP8A8PrlZd31AdbcF_BPVRz6Q4OymDEc",
            authDomain: "island-toast-app.firebaseapp.com",
            projectId: "island-toast-app",
            storageBucket: "island-toast-app.firebasestorage.app",
            messagingSenderId: "426992761060",
            appId: "1:426992761060:web:4cf940fedbc1fa2a3cd4f1"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(app);
        const db = firebase.firestore(app);
        const ISLAND_APP_ID = 'island-toast-live';
        const FIXED_LINE_ID = '@516mdfqz';
        const LINE_URL = `https://line.me/R/ti/p/${FIXED_LINE_ID}`;

        const Icon = ({ name, size = 24, color = 'currentColor', className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    const iconNode = window.lucide.icons[name];
                    const svg = window.lucide.createElement(iconNode);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    svg.setAttribute('stroke', color);
                    svg.setAttribute('stroke-width', '2.5');
                    svg.setAttribute('class', `lucide lucide-${name} ${className}`);
                    if (iconRef.current) { iconRef.current.innerHTML = ''; iconRef.current.appendChild(svg); }
                }
            }, [name, size, color, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [viewMode, setViewMode] = useState('month'); // 'month' or 'week'
            const [currentDate, setCurrentDate] = useState(new Date());
            const [events, setEvents] = useState({});
            const [photos, setPhotos] = useState([]);
            const [appSettings, setAppSettings] = useState({
                title: '島嶼生吐司',
                subtitle: 'ISLAND TOAST',
                marquee: '🍞 每日新鮮限量現烤，歡迎透過 LINE 提前預約！',
                logoUrl: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=200'
            });

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedDate, setSelectedDate] = useState(null);
            const [editingEvent, setEditingEvent] = useState({ location: '', address: '', time: '', type: 'work' });
            const [zoomImg, setZoomImg] = useState(null);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('admin') === '1') setIsAdmin(true);
                auth.signInAnonymously().catch(console.error);
                const unsubscribe = auth.onAuthStateChanged(u => setUser(u));
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubEvents = db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('events')
                    .onSnapshot(snap => {
                        const data = {};
                        snap.forEach(d => data[d.id] = d.data());
                        setEvents(data);
                    });
                const unsubPhotos = db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('photos')
                    .onSnapshot(snap => {
                        const data = [];
                        snap.forEach(d => data.push({ id: d.id, ...d.data() }));
                        setPhotos(data.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                    });
                return () => { unsubEvents(); unsubPhotos(); };
            }, [user]);

            const formatDateKey = (date) => {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            };

            const getWeekNumber = (date) => {
                const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
                const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
                return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
            };

            const changeMonth = (offset) => {
                const d = new Date(currentDate);
                d.setMonth(currentDate.getMonth() + offset);
                setCurrentDate(d);
            };

            const changeWeek = (offset) => {
                const d = new Date(currentDate);
                d.setDate(currentDate.getDate() + (offset * 7));
                setCurrentDate(d);
            };

            const weekDays = useMemo(() => {
                const start = new Date(currentDate);
                start.setDate(currentDate.getDate() - currentDate.getDay());
                return Array.from({ length: 7 }, (_, i) => {
                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    return d;
                });
            }, [currentDate]);

            const renderMonthCalendar = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDayOfMonth = new Date(year, month, 1);
                const firstDayWeekday = firstDayOfMonth.getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const totalCells = firstDayWeekday + daysInMonth;
                const totalRows = Math.ceil(totalCells / 7);

                let currentDay = 1;
                const rows = [];
                for (let r = 0; r < totalRows; r++) {
                    const cells = [];
                    const rowFirstDay = new Date(year, month, currentDay - firstDayWeekday);
                    cells.push(
                        <div key={`w-${r}`} className="flex items-center justify-center bg-gray-50/50 border-r border-gray-100 text-[9px] font-black text-gray-400">
                            W{getWeekNumber(rowFirstDay)}
                        </div>
                    );

                    for (let c = 0; c < 7; c++) {
                        const cellIdx = r * 7 + c;
                        const dayNum = cellIdx - firstDayWeekday + 1;
                        if (dayNum > 0 && dayNum <= daysInMonth) {
                            const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                            const ev = events[dateKey];
                            const isToday = new Date().toDateString() === new Date(year, month, dayNum).toDateString();
                            cells.push(
                                <div key={dateKey} onClick={() => { setSelectedDate(dateKey); setEditingEvent(ev || { location: '', address: '', time: '', type: 'work' }); setIsModalOpen(true); }}
                                    className="h-16 border-t border-r border-gray-100 p-1 cursor-pointer hover:bg-orange-50 transition-colors relative">
                                    <span className={`text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full ${isToday ? 'bg-orange-500 text-white' : 'text-gray-400'}`}>{dayNum}</span>
                                    {ev && (
                                        <div className={`mt-1 text-[8px] p-0.5 rounded-sm truncate font-bold border-l-2 ${ev.type === 'work' ? 'bg-orange-100 text-orange-700 border-orange-500' : 'bg-gray-100 text-gray-400 border-gray-300'}`}>
                                            {ev.type === 'rest' ? '休' : ev.location}
                                        </div>
                                    )}
                                </div>
                            );
                        } else {
                            cells.push(<div key={`e-${cellIdx}`} className="h-16 border-t border-r border-gray-100 bg-gray-50/20"></div>);
                        }
                    }
                    rows.push(<div key={`r-${r}`} className="calendar-grid">{cells}</div>);
                }
                return rows;
            };

            const renderWeekView = () => {
                const weekLabel = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
                return (
                    <div className="p-4 space-y-3">
                        {weekDays.map((date, i) => {
                            const dateKey = formatDateKey(date);
                            const ev = events[dateKey];
                            const isToday = new Date().toDateString() === date.toDateString();
                            return (
                                <div key={dateKey} onClick={() => { setSelectedDate(dateKey); setEditingEvent(ev || { location: '', address: '', time: '', type: 'work' }); setIsModalOpen(true); }}
                                    className={`flex items-center gap-4 p-4 rounded-2xl border transition-all cursor-pointer ${isToday ? 'border-orange-500 bg-orange-50/30' : 'border-gray-100 bg-white hover:border-orange-200'}`}>
                                    <div className="flex flex-col items-center justify-center min-w-[50px]">
                                        <span className="text-[10px] font-bold text-gray-400">{weekLabel[i]}</span>
                                        <span className={`text-xl font-black ${isToday ? 'text-orange-500' : 'text-gray-700'}`}>{date.getDate()}</span>
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        {ev ? (
                                            <div className="flex flex-col">
                                                <div className={`text-sm font-black ${ev.type === 'rest' ? 'text-gray-400' : 'text-gray-800'}`}>
                                                    {ev.type === 'rest' ? '今日店休 REST DAY' : ev.location}
                                                </div>
                                                {ev.type === 'work' && (
                                                    <div className="flex flex-col gap-0.5 mt-1">
                                                        <div className="text-[10px] text-orange-600 font-bold flex items-center gap-1"><Icon name="Clock" size={10} /> {ev.time || '時間待定'}</div>
                                                        <div className="text-[10px] text-gray-400 truncate flex items-center gap-1"><Icon name="MapPin" size={10} /> {ev.address || '地點詳洽'}</div>
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="text-xs text-gray-300 font-medium">尚無安排行程</div>
                                        )}
                                    </div>
                                    <Icon name="ChevronRight" size={16} color="#e5e7eb" />
                                </div>
                            );
                        })}
                    </div>
                );
            };

            return (
                <div className="min-h-screen py-6 px-4 flex flex-col items-center">
                    <div className="w-full max-w-md bg-white shadow-2xl rounded-[3rem] overflow-hidden relative border border-gray-100">
                        {/* 頂部功能區 */}
                        <div className="absolute top-8 right-8 flex gap-3 z-50 no-print">
                            {isAdmin && (
                                <button onClick={() => alert('請在行事曆上點選日期進行編輯')} className="p-2.5 bg-white/90 backdrop-blur rounded-full shadow-lg text-gray-600 hover:text-orange-500 border border-gray-100">
                                    <Icon name="Edit3" size={18} />
                                </button>
                            )}
                        </div>

                        {/* 跑馬燈 */}
                        <div className="bg-orange-600 text-white py-2.5 overflow-hidden">
                            <div className="animate-marquee whitespace-nowrap font-bold text-[10px] tracking-widest">
                                <span className="px-12">{appSettings.marquee}</span>
                                <span className="px-12">{appSettings.marquee}</span>
                            </div>
                        </div>

                        {/* Logo & 標題 */}
                        <div className="pt-14 pb-8 flex flex-col items-center">
                            <img src={appSettings.logoUrl} className="w-24 h-24 rounded-[2rem] object-cover shadow-xl border-4 border-white mb-4" />
                            <h1 className="text-3xl font-black text-gray-800 tracking-tight">{appSettings.title}</h1>
                            <p className="text-orange-500 font-black text-[10px] tracking-[0.4em] uppercase mt-1">{appSettings.subtitle}</p>
                        </div>

                        {/* 視圖切換 */}
                        <div className="px-6 flex gap-2 mb-4 no-print">
                            <button onClick={() => setViewMode('month')} className={`flex-1 py-3 rounded-2xl font-black text-sm transition-all flex items-center justify-center gap-2 ${viewMode === 'month' ? 'bg-orange-500 text-white shadow-lg shadow-orange-100' : 'bg-gray-100 text-gray-400'}`}>
                                <Icon name="Calendar" size={16} /> 月檢視
                            </button>
                            <button onClick={() => setViewMode('week')} className={`flex-1 py-3 rounded-2xl font-black text-sm transition-all flex items-center justify-center gap-2 ${viewMode === 'week' ? 'bg-orange-500 text-white shadow-lg shadow-orange-100' : 'bg-gray-100 text-gray-400'}`}>
                                <Icon name="Layout" size={16} /> 週行程
                            </button>
                        </div>

                        {/* 日曆/週次控制器 */}
                        <div className="px-6 pb-6">
                            <div className="bg-white rounded-[2rem] border border-gray-100 overflow-hidden shadow-sm">
                                <div className="flex items-center justify-between p-5 bg-orange-50/50">
                                    <button onClick={() => viewMode === 'month' ? changeMonth(-1) : changeWeek(-1)} className="p-1.5 bg-white rounded-full shadow-sm no-print">
                                        <Icon name="ChevronLeft" color="#f97316" size={20} />
                                    </button>
                                    <div className="flex flex-col items-center">
                                        <span className="font-black text-gray-700 text-base">
                                            {viewMode === 'month' ? `${currentDate.getFullYear()} 年 ${currentDate.getMonth() + 1} 月` : `W${getWeekNumber(currentDate)} 週行程`}
                                        </span>
                                        {viewMode === 'week' && <span className="text-[10px] font-bold text-orange-400">{formatDateKey(weekDays[0])} - {formatDateKey(weekDays[6])}</span>}
                                    </div>
                                    <button onClick={() => viewMode === 'month' ? changeMonth(1) : changeWeek(1)} className="p-1.5 bg-white rounded-full shadow-sm no-print">
                                        <Icon name="ChevronRight" color="#f97316" size={20} />
                                    </button>
                                </div>

                                {viewMode === 'month' ? (
                                    <>
                                        <div className="calendar-grid text-center border-t border-gray-100 bg-gray-50/30">
                                            <div className="py-2.5 text-[9px] font-black text-gray-300 border-r border-gray-100">WEEK</div>
                                            {['日','一','二','三','四','五','六'].map(d => <div key={d} className="py-2.5 text-[10px] font-bold text-gray-400 border-r border-gray-100 last:border-0">{d}</div>)}
                                        </div>
                                        <div className="flex flex-col border-t border-gray-100">
                                            {renderMonthCalendar()}
                                        </div>
                                    </>
                                ) : (
                                    <div className="bg-gray-50/30">{renderWeekView()}</div>
                                )}
                            </div>
                            
                            {/* 分享提示 - 僅在週模式顯示 */}
                            {viewMode === 'week' && (
                                <div className="mt-4 p-4 bg-blue-50 rounded-2xl border border-blue-100 flex items-center gap-3 no-print">
                                    <div className="p-2 bg-blue-500 rounded-lg"><Icon name="Smartphone" color="white" size={18} /></div>
                                    <div>
                                        <p className="text-xs font-black text-blue-800">方便分享到 IG / FB</p>
                                        <p className="text-[10px] text-blue-600 font-medium leading-relaxed">切換到此畫面直接截圖，即可作為每週行程表發布公告！</p>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* LINE 預約 */}
                        <div className="px-8 pb-12">
                            <a href={LINE_URL} target="_blank" className="flex items-center justify-center gap-3 bg-[#06C755] text-white py-5 rounded-[1.5rem] font-black text-xl no-print transition-all active:scale-95 shadow-xl shadow-green-100">
                                <Icon name="MessageSquare" color="white" /> LINE 預訂行程
                            </a>
                        </div>
                    </div>

                    {/* 彈窗：詳情與編輯 */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-6 z-[100] no-print" onClick={() => setIsModalOpen(false)}>
                            <div className="bg-white rounded-[3rem] w-full max-w-sm p-8 shadow-2xl relative" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-8">
                                    <div className="flex flex-col">
                                        <span className="text-[10px] font-black text-orange-500 tracking-widest uppercase">Schedule Detail</span>
                                        <h3 className="text-2xl font-black text-gray-800">{selectedDate}</h3>
                                    </div>
                                    <button onClick={()=>setIsModalOpen(false)} className="w-10 h-10 flex items-center justify-center bg-gray-100 rounded-full text-gray-400 hover:text-gray-600 transition-colors"><Icon name="X" size={20}/></button>
                                </div>

                                {isAdmin ? (
                                    <div className="space-y-4">
                                        <div className="flex bg-gray-100 p-1.5 rounded-2xl">
                                            <button onClick={()=>setEditingEvent({...editingEvent, type:'work'})} className={`flex-1 py-3 rounded-xl font-black text-sm transition-all ${editingEvent.type==='work'?'bg-white shadow text-orange-600':'text-gray-400'}`}>出攤市集</button>
                                            <button onClick={()=>setEditingEvent({...editingEvent, type:'rest'})} className={`flex-1 py-3 rounded-xl font-black text-sm transition-all ${editingEvent.type==='rest'?'bg-white shadow text-gray-600':'text-gray-400'}`}>今日店休</button>
                                        </div>
                                        {editingEvent.type === 'work' && (
                                            <>
                                                <input className="w-full bg-gray-50 p-4 rounded-2xl font-bold border border-gray-100 outline-none focus:border-orange-500" placeholder="市集名稱 (e.g. 大稻埕碼頭)" value={editingEvent.location} onChange={e=>setEditingEvent({...editingEvent, location:e.target.value})} />
                                                <input className="w-full bg-gray-50 p-4 rounded-2xl font-bold border border-gray-100 outline-none focus:border-orange-500" placeholder="詳細地址" value={editingEvent.address} onChange={e=>setEditingEvent({...editingEvent, address:e.target.value})} />
                                                <input className="w-full bg-gray-50 p-4 rounded-2xl font-bold border border-gray-100 outline-none focus:border-orange-500" placeholder="營業時間 (e.g. 14:00 - 完售)" value={editingEvent.time} onChange={e=>setEditingEvent({...editingEvent, time:e.target.value})} />
                                            </>
                                        )}
                                        <button onClick={async()=>{ 
                                            await db.collection('artifacts').doc(ISLAND_APP_ID).collection('public').doc('data').collection('events').doc(selectedDate).set(editingEvent); 
                                            setIsModalOpen(false); 
                                        }} className="w-full bg-gray-800 text-white py-5 rounded-[1.5rem] font-black shadow-xl mt-4 active:scale-95 transition-all">更新排程</button>
                                    </div>
                                ) : (
                                    <div className="text-center">
                                        {events[selectedDate] ? (
                                            <div className="space-y-6">
                                                <div className={`p-8 rounded-[2rem] ${events[selectedDate].type === 'rest' ? 'bg-gray-50 border border-gray-100' : 'bg-orange-50/50 border border-orange-100'}`}>
                                                    <div className="text-2xl font-black text-gray-800 leading-tight mb-2">
                                                        {events[selectedDate].type === 'rest' ? '今日店休 REST DAY' : events[selectedDate].location}
                                                    </div>
                                                    {events[selectedDate].type === 'work' && (
                                                        <div className="space-y-3 mt-4">
                                                            <div className="text-orange-600 font-black flex items-center justify-center gap-2"><Icon name="Clock" size={16} /> {events[selectedDate].time || '14:00 - 完售'}</div>
                                                            {events[selectedDate].address && (
                                                                <div className="text-gray-400 text-sm font-bold flex items-center justify-center gap-2 leading-relaxed">
                                                                    <Icon name="MapPin" size={16} /> {events[selectedDate].address}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                                {events[selectedDate].type === 'work' && (events[selectedDate].address || events[selectedDate].location) && (
                                                    <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(events[selectedDate].address || events[selectedDate].location)}`} target="_blank" className="flex items-center justify-center gap-3 w-full bg-blue-500 text-white py-5 rounded-[1.5rem] font-black shadow-xl shadow-blue-100 transition-all active:scale-95">
                                                        <Icon name="Map" color="white" /> Google 地圖導航
                                                    </a>
                                                )}
                                            </div>
                                        ) : <p className="text-gray-300 font-bold py-12 text-lg italic">此日暫無公開行程</p>}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
