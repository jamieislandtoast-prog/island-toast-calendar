<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>島嶼生吐司-餐車跑攤行事曆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
        .lucide { display: inline-block; vertical-align: middle; }
        #root:empty::before {
            content: "系統啟動中...";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ea580c;
            font-size: 16px;
            font-weight: bold;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .animate-pop { animation: fadeIn 0.2s ease-out forwards; }
        .calendar-capture-area { background-color: #fffbf5; }
    </style>
</head>
<body class="bg-orange-50/30">
    <div id="root"></div>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
      }
    }
    </script>

    <script type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import ReactDOM from 'react-dom';
        import * as LucideIcons from 'lucide-react';
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, addDoc, serverTimestamp } from "firebase/firestore";

        // --- Firebase 配置 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBiP8A8PrlZd31AdbcF_BPVRz6Q4OymDEc", 
            authDomain: "island-toast-app.firebaseapp.com",
            projectId: "island-toast-app",
            storageBucket: "island-toast-app.firebasestorage.app",
            messagingSenderId: "426992761060",
            appId: "1:426992761060:web:4cf940fedbc1fa2a3cd4f1"
        };
        const appId = 'island-toast-calendar';

        const Icon = ({ name, size = 16, className = "" }) => {
            const IconComponent = LucideIcons[name] || LucideIcons.HelpCircle;
            return React.createElement(IconComponent, { size, className });
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false); 
            const [currentDate, setCurrentDate] = useState(new Date());
            const [events, setEvents] = useState({});
            const [photos, setPhotos] = useState([]);
            const [appSettings, setAppSettings] = useState({
                title: '島嶼生吐司',
                subtitle: '餐車跑攤行事曆',
                logoUrl: '',
                lineId: '@516mdfqz'
            });

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedDate, setSelectedDate] = useState(null);
            const [editingEvent, setEditingEvent] = useState({ location: '', time: '', note: '', type: 'work' });
            const [isUploading, setIsUploading] = useState(false);
            const [isEditingSettings, setIsEditingSettings] = useState(false);
            
            const dbRef = useRef(null);
            const captureRef = useRef(null);
            const fileInputRef = useRef(null);
            const logoInputRef = useRef(null);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('admin') === '1') setIsAdmin(true);

                try {
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    dbRef.current = getFirestore(app);
                    signInAnonymously(auth);
                    onAuthStateChanged(auth, u => setUser(u));
                } catch (e) {
                    console.error("Init Error", e);
                }
            }, []);

            useEffect(() => {
                if (!user || !dbRef.current) return;
                const db = dbRef.current;
                
                const unsubEvents = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'events'), snap => {
                    const data = {}; snap.forEach(d => data[d.id] = d.data()); setEvents(data);
                });

                const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general'), snap => {
                    if (snap.exists()) setAppSettings(prev => ({ ...prev, ...snap.data() }));
                });

                const unsubPhotos = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'photos'), snap => {
                    const data = []; snap.forEach(d => data.push({ id: d.id, ...d.data() }));
                    setPhotos(data.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                });

                return () => { unsubEvents(); unsubSettings(); unsubPhotos(); };
            }, [user]);

            const saveEvent = async () => {
                if (!isAdmin || !selectedDate) return;
                const docRef = doc(dbRef.current, 'artifacts', appId, 'public', 'data', 'events', selectedDate);
                await setDoc(docRef, editingEvent);
                setIsModalOpen(false);
            };

            const deleteEvent = async () => {
                if (!isAdmin || !selectedDate) return;
                const docRef = doc(dbRef.current, 'artifacts', appId, 'public', 'data', 'events', selectedDate);
                await deleteDoc(docRef);
                setIsModalOpen(false);
            };

            const handleFileUpload = async (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true);
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const base64 = event.target.result;
                    if (type === 'logo') {
                        await setDoc(doc(dbRef.current, 'artifacts', appId, 'public', 'data', 'settings', 'general'), { logoUrl: base64 }, { merge: true });
                    } else {
                        await addDoc(collection(dbRef.current, 'artifacts', appId, 'public', 'data', 'photos'), { url: base64, createdAt: serverTimestamp() });
                    }
                    setIsUploading(false);
                };
                reader.readAsDataURL(file);
            };

            const takeScreenshot = () => {
                if (!captureRef.current) return;
                html2canvas(captureRef.current, { useCORS: true, backgroundColor: "#fffbf5", scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `島嶼生吐司-${currentDate.getFullYear()}-${currentDate.getMonth()+1}月行程.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                });
            };

            const getLineLink = (event) => {
                const dateStr = selectedDate || "";
                const locStr = event?.location || "（尚未填寫場次）";
                const template = `您好，我想預訂吐司：\n日期：${dateStr}\n場次：${locStr}\n口味數量：\n姓名：\n電話：\n地址：`;
                return `https://line.me/R/ti/p/~${appSettings.lineId.replace('@','')}/?text=${encodeURIComponent(template)}`;
            };

            const renderCalendar = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const totalDays = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(React.createElement('div', { key: `e-${i}`, className: "h-20 border border-orange-50/50" }));
                for (let d = 1; d <= totalDays; d++) {
                    const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const event = events[dateKey];
                    const isToday = new Date().toDateString() === new Date(year, month, d).toDateString();
                    
                    // 訪客模式下，如果沒有 event (或是設定為店休且無備註)，可以選擇不讓點擊，或是點擊後顯示公休
                    const canClick = isAdmin || event;

                    days.push(
                        React.createElement('div', {
                            key: d,
                            onClick: () => {
                                if (!canClick) return;
                                setSelectedDate(dateKey);
                                setEditingEvent(events[dateKey] || { location: '', time: '', note: '', type: 'rest' });
                                setIsModalOpen(true);
                            },
                            className: `h-20 border border-orange-100 p-1 transition-all bg-white relative ${canClick ? 'cursor-pointer hover:bg-orange-50' : 'opacity-60 cursor-default'}`
                        }, [
                            React.createElement('span', { 
                                key: 'day',
                                className: `text-[11px] font-black ${isToday ? 'bg-orange-600 text-white w-6 h-6 flex items-center justify-center rounded-full' : 'text-gray-400'}` 
                            }, d),
                            event && React.createElement('div', {
                                key: 'event',
                                className: `mt-1 p-1 rounded-[6px] text-[10px] leading-tight break-all border-l-4 shadow-sm font-bold ${event.type === 'work' ? 'bg-orange-50 text-orange-700 border-orange-500' : 'bg-gray-100 text-gray-500 border-gray-400'}`
                            }, event.type === 'rest' ? '店休' : event.location)
                        ])
                    );
                }
                return days;
            };

            if (!user) return React.createElement('div', { className: "flex items-center justify-center min-h-screen text-orange-600 font-bold" }, "伺服器連線中...");

            return (
                React.createElement('div', { className: "min-h-screen flex flex-col items-center py-6 px-2" }, [
                    React.createElement('div', { ref: captureRef, className: "w-full max-w-sm bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-orange-100 relative calendar-capture-area" }, [
                        isAdmin && React.createElement('div', { className: "bg-yellow-400 text-[10px] font-black py-1.5 text-center flex items-center justify-center gap-2" }, [
                            React.createElement(Icon, { name: 'Lock', size: 12 }), "管理員模式：點擊日期可編輯"
                        ]),
                        
                        // Header (加大標題與 Logo)
                        React.createElement('div', { className: "bg-orange-600 p-8 text-white text-left relative" }, [
                            React.createElement('div', { className: "flex justify-between items-center mb-8" }, [
                                React.createElement('div', { className: "flex gap-5 items-center" }, [
                                    React.createElement('div', { 
                                        onClick: () => isAdmin && logoInputRef.current.click(),
                                        className: `w-20 h-20 bg-white rounded-2xl flex items-center justify-center border-4 border-orange-400 shadow-xl overflow-hidden ${isAdmin ? 'cursor-pointer hover:opacity-80' : ''}` 
                                    }, 
                                        appSettings.logoUrl ? React.createElement('img', { src: appSettings.logoUrl, className: "w-full h-full object-cover" }) : React.createElement(Icon, { name: 'Camera', size: 32, className: "text-orange-200" })
                                    ),
                                    React.createElement('div', {}, [
                                        React.createElement('h1', { className: "text-3xl font-black tracking-tighter" }, appSettings.title),
                                        React.createElement('p', { className: "text-orange-100 text-sm font-bold opacity-90 mt-1" }, appSettings.subtitle)
                                    ])
                                ]),
                                isAdmin && React.createElement('button', { onClick: takeScreenshot, className: "bg-white/20 p-3 rounded-2xl hover:bg-white/30" }, React.createElement(Icon, { name: 'Download', size: 20 }))
                            ]),
                            
                            // 月份切換
                            React.createElement('div', { className: "flex items-center justify-between bg-black/10 p-4 rounded-2xl" }, [
                                React.createElement('button', { className: "p-2", onClick: () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1)) }, React.createElement(Icon, { name: 'ChevronLeft', size: 24 })),
                                React.createElement('div', { className: "text-center" }, [
                                    React.createElement('span', { className: "text-2xl font-black" }, `${currentDate.getMonth()+1}月`),
                                    React.createElement('span', { className: "ml-2 text-sm opacity-70" }, currentDate.getFullYear())
                                ]),
                                React.createElement('button', { className: "p-2", onClick: () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1)) }, React.createElement(Icon, { name: 'ChevronRight', size: 24 }))
                            ]),

                            React.createElement('a', { 
                                href: `https://line.me/R/ti/p/~${appSettings.lineId.replace('@','')}`,
                                className: "w-full bg-[#06C755] mt-6 py-4 rounded-2xl flex items-center justify-center gap-3 text-lg font-black shadow-xl active:scale-95 transition-transform" 
                            }, [React.createElement(Icon, { name: 'MessageCircle', size: 24 }), "LINE 客服預訂"])
                        ]),

                        // Calendar
                        React.createElement('div', { className: "grid grid-cols-7 text-center text-xs font-black py-4 bg-orange-50/50 text-orange-600 border-b border-orange-100" }, 
                            ['日','一','二','三','四','五','六'].map(d => React.createElement('div', { key: d }, d))
                        ),
                        React.createElement('div', { className: "grid grid-cols-7" }, renderCalendar()),

                        // News
                        React.createElement('div', { className: "p-8 bg-gray-50 min-h-[300px] pb-20" }, [
                            React.createElement('div', { className: "flex justify-between items-center mb-6" }, [
                                React.createElement('h3', { className: "font-black text-orange-600 text-sm flex items-center gap-2" }, [React.createElement(Icon, { name: 'Megaphone', size: 18 }), "最新公告 / 菜單"]),
                                isAdmin && React.createElement('button', { onClick: () => fileInputRef.current.click(), className: "bg-orange-600 text-white p-2 rounded-full shadow-lg" }, React.createElement(Icon, { name: 'Plus', size: 16 }))
                            ]),
                            photos.length === 0 ? React.createElement('div', { className: "text-center py-20 text-gray-300 text-sm font-bold border-2 border-dashed border-gray-200 rounded-3xl" }, "目前尚無新公告") : 
                            photos.map(p => React.createElement('div', { key: p.id, className: "mb-6 rounded-3xl overflow-hidden shadow-xl border-4 border-white relative group" }, [
                                React.createElement('img', { src: p.url, className: "w-full h-auto" }),
                                isAdmin && React.createElement('button', { 
                                    onClick: async () => { if(confirm('確定刪除？')) await deleteDoc(doc(dbRef.current, 'artifacts', appId, 'public', 'data', 'photos', p.id)); },
                                    className: "absolute top-4 right-4 bg-red-500 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity" 
                                }, React.createElement(Icon, { name: 'Trash2', size: 16 }))
                            ]))
                        ])
                    ]),

                    // 隱藏的 Input
                    React.createElement('input', { type: 'file', ref: fileInputRef, className: "hidden", onChange: (e) => handleFileUpload(e, 'photo') }),
                    React.createElement('input', { type: 'file', ref: logoInputRef, className: "hidden", onChange: (e) => handleFileUpload(e, 'logo') }),

                    // 行程 Modal
                    isModalOpen && React.createElement('div', { 
                        className: "fixed inset-0 bg-black/80 flex items-center justify-center p-6 z-50 backdrop-blur-sm",
                        onClick: () => setIsModalOpen(false)
                    }, 
                        React.createElement('div', { 
                            className: "bg-white rounded-[2.5rem] w-full max-w-sm overflow-hidden animate-pop shadow-2xl",
                            onClick: e => e.stopPropagation()
                        }, [
                            React.createElement('div', { className: "bg-orange-600 p-6 text-white flex justify-between items-center" }, [
                                React.createElement('h4', { className: "font-black text-lg" }, selectedDate),
                                React.createElement('button', { onClick: () => setIsModalOpen(false) }, React.createElement(Icon, { name: 'X', size: 24 }))
                            ]),
                            
                            React.createElement('div', { className: "p-8 space-y-6" }, [
                                isAdmin ? React.createElement('div', { className: "space-y-4" }, [
                                    React.createElement('div', { className: "flex gap-2 p-1.5 bg-gray-100 rounded-2xl" }, [
                                        React.createElement('button', { 
                                            onClick: () => setEditingEvent({...editingEvent, type:'work'}),
                                            className: `flex-1 py-3 rounded-xl font-black text-sm ${editingEvent.type==='work' ? 'bg-white text-orange-600 shadow-md' : 'text-gray-400'}`
                                        }, "擺攤"),
                                        React.createElement('button', { 
                                            onClick: () => setEditingEvent({...editingEvent, type:'rest'}),
                                            className: `flex-1 py-3 rounded-xl font-black text-sm ${editingEvent.type==='rest' ? 'bg-white text-gray-400 shadow-md' : 'text-gray-400'}`
                                        }, "店休")
                                    ]),
                                    editingEvent.type === 'work' && React.createElement('div', { className: "space-y-4" }, [
                                        React.createElement('input', { 
                                            placeholder: "地點", className: "w-full p-4 bg-gray-50 rounded-2xl border-none font-bold text-sm outline-none ring-2 ring-transparent focus:ring-orange-500",
                                            value: editingEvent.location, onChange: e => setEditingEvent({...editingEvent, location: e.target.value})
                                        }),
                                        React.createElement('input', { 
                                            placeholder: "時間 (例如 14:00 - 18:00)", className: "w-full p-4 bg-gray-50 rounded-2xl border-none font-bold text-sm outline-none ring-2 ring-transparent focus:ring-orange-500",
                                            value: editingEvent.time, onChange: e => setEditingEvent({...editingEvent, time: e.target.value})
                                        })
                                    ]),
                                    React.createElement('textarea', { 
                                        placeholder: "備註說明...", className: "w-full p-4 bg-gray-50 rounded-2xl border-none font-bold text-sm h-24 outline-none ring-2 ring-transparent focus:ring-orange-500",
                                        value: editingEvent.note, onChange: e => setEditingEvent({...editingEvent, note: e.target.value})
                                    }),
                                    React.createElement('div', { className: "flex gap-3" }, [
                                        React.createElement('button', { onClick: saveEvent, className: "flex-1 py-4 bg-orange-600 text-white font-black rounded-2xl shadow-lg" }, "儲存行程"),
                                        React.createElement('button', { onClick: deleteEvent, className: "p-4 bg-red-100 text-red-600 rounded-2xl" }, React.createElement(Icon, { name: 'Trash2', size: 20 }))
                                    ])
                                ]) : 
                                // 客人視圖
                                React.createElement('div', { className: "space-y-6 text-center py-4" }, [
                                    editingEvent.type === 'rest' ? React.createElement('div', {}, [
                                        React.createElement('div', { className: "text-4xl mb-4" }, "😴"),
                                        React.createElement('p', { className: "text-2xl font-black text-gray-300" }, "今日店休"),
                                        React.createElement('p', { className: "text-gray-400 mt-2 text-sm" }, editingEvent.note || "休息是為了走更長遠的路")
                                    ]) : React.createElement('div', { className: "space-y-6" }, [
                                        React.createElement('div', { className: "bg-orange-50 p-6 rounded-3xl" }, [
                                            React.createElement('p', { className: "text-xs font-black text-orange-400 uppercase tracking-widest mb-2" }, "地點"),
                                            React.createElement('p', { className: "text-xl font-black text-orange-700" }, editingEvent.location || "未設定地點")
                                        ]),
                                        React.createElement('div', { className: "bg-gray-50 p-6 rounded-3xl" }, [
                                            React.createElement('p', { className: "text-xs font-black text-gray-400 uppercase tracking-widest mb-2" }, "營業時間"),
                                            React.createElement('p', { className: "text-xl font-black text-gray-700" }, editingEvent.time || "未設定時間")
                                        ]),
                                        editingEvent.note && React.createElement('div', { className: "text-sm font-bold text-gray-500 italic bg-yellow-50/50 p-4 rounded-2xl" }, editingEvent.note),
                                        React.createElement('a', { 
                                            href: getLineLink(editingEvent),
                                            className: "w-full bg-[#06C755] py-4 rounded-2xl flex items-center justify-center gap-2 text-white font-black shadow-lg" 
                                        }, [React.createElement(Icon, { name: 'ShoppingCart', size: 20 }), "立即 LINE 預訂本場次"])
                                    ]),
                                    React.createElement('button', { onClick: () => setIsModalOpen(false), className: "w-full py-4 text-gray-400 font-bold" }, "關閉視窗")
                                ])
                            ])
                        ])
                    )
                ])
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
    </script>
</body>
</html>
